<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate/series - 성배전쟁</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-color: #000000;
        }

        /* 메인 배경 이미지 */
        .main-background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('first-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
        }

        .main-background-layer.active {
            opacity: 1;
        }

        /* 화면 아래 붉은 먼지/안개 이펙트 */
        .red-dust-effect {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(to top, rgba(140, 10, 10, 0.35) 0%, rgba(70, 0, 0, 0.15) 50%, transparent 100%);
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            transition: opacity 1.8s ease-in-out;
        }

        .red-dust-effect.active {
            opacity: 0.55;
            animation: dust-fade-soft 5s infinite alternate ease-in-out 1.8s;
        }

        /* --- 1. [시작하기] UI 버튼 --- */
        .start-btn-container {
            position: absolute;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            transform: translateX(2px);
        }

        .fate-start-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #f5f0e6;
            background: rgba(20, 0, 0, 0.85);
            border: 2px solid #900000;
            padding: 16px 48px;
            letter-spacing: 6px;
            margin-right: -6px;
            cursor: pointer;
            outline: none;
            position: relative;
            box-shadow: 0 0 15px rgba(140, 0, 0, 0.6), inset 0 0 10px rgba(100, 0, 0, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .fate-start-btn:hover {
            color: #ffffff;
            background: rgba(60, 0, 0, 0.95);
            border-color: #ff2222;
            box-shadow: 0 0 25px rgba(255, 30, 30, 0.9), inset 0 0 15px rgba(180, 0, 0, 0.8);
            transform: scale(1.05);
        }

        .start-btn-container.hide {
            opacity: 0;
            transform: translateX(2px) scale(0.9);
            pointer-events: none;
        }

        /* --- 2. 타이틀 컨텐츠 컨테이너 --- */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
            background: transparent;
            margin: 0 auto;
            pointer-events: none;
            transform: translateY(-10px);
        }

        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background: transparent !important;
            margin-bottom: 15px;
            opacity: 0;
        }

        .holy-grail-wrapper.animate {
            animation: grail-smooth-fadein 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .holy-grail-img {
            width: 170px;
            max-width: 100%;
            height: auto;
            animation: grail-gentle-float 3s infinite ease-in-out;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
            display: block;
            margin: 0 auto;
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 7px;
            margin-right: -7px;
            transform: translateX(2px);
            margin-bottom: 12px;
            color: #f5f0e6;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 35px rgba(255, 50, 50, 0.7);
            text-transform: uppercase;
            opacity: 0;
        }

        .main-title.animate {
            animation: fade-in 1.0s ease-out forwards;
        }

        .sub-title {
            font-size: 1.15rem;
            font-weight: 400;
            color: rgba(215, 215, 225, 0.85);
            letter-spacing: 1px;
            margin-right: -1px;
            transform: translateX(2px);
            line-height: 1.6;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 1), 0 0 15px rgba(0, 0, 0, 0.9);
            padding: 0 15px;
            margin-bottom: 35px;
            opacity: 0;
        }

        .sub-title.animate {
            animation: fade-in 1.0s ease-out forwards;
        }

        /* PRESS TO START 버튼 */
        .press-start-wrapper {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-out;
            transform: translateX(2px);
            position: relative;
        }

        .press-start-wrapper.animate {
            opacity: 1;
            pointer-events: auto;
        }

        .press-start-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #a0a0aa;
            letter-spacing: 5px;
            margin-right: -5px;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 0 5px rgba(100, 100, 110, 0.5);
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease, text-shadow 0.3s ease, transform 0.2s ease;
            animation: slow-blink-loop 2.8s infinite alternate ease-in-out;
        }

        .press-start-btn:hover {
            animation-play-state: paused !important;
            opacity: 1 !important;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 8px rgba(255, 255, 255, 0.9);
            transform: scale(1.08);
        }

        .press-start-wrapper.flash-exit {
            animation: simple-flash-fade 0.25s ease-out forwards !important;
            pointer-events: none !important;
        }

        .slow-fade-out {
            animation: pure-fade-out 1.2s ease-out forwards !important;
            pointer-events: none !important;
        }

        /* --- 3. 메인 화면 좌측 하단 유입자 안내 문구 --- */
        .intro-notice-left {
            position: absolute;
            bottom: 25px;
            left: 25px;
            z-index: 20;
            max-width: 500px;
            font-size: 1.05rem;
            color: rgba(230, 220, 205, 0.65);
            letter-spacing: 1px;
            line-height: 1.45;
            user-select: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 5px rgba(100, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            word-break: keep-all;
        }

        .intro-notice-left.animate {
            animation: fade-in 1.2s ease-out forwards;
        }

        .intro-notice-left.slow-fade-out {
            animation: pure-fade-out 1.2s ease-out forwards !important;
        }

        /* --- 4. 다음 페이지: 중앙 [성배] 클릭 가능 대형 텍스트 --- */
        .center-grail-text-container {
            position: absolute;
            z-index: 30;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.0s ease-out, top 1.0s ease-in-out, left 1.0s ease-in-out, transform 1.0s ease-in-out, filter 1.0s ease-in-out;
        }

        .center-grail-text-container.show {
            opacity: 1;
            pointer-events: auto;
        }

        .center-grail-btn {
            font-family: 'Song Myung', serif;
            font-size: 4.5rem;
            font-weight: 700;
            color: #fffdfa;
            letter-spacing: 12px;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            user-select: none;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 40px rgba(255, 215, 0, 0.8);
            transition: transform 0.3s ease, color 0.3s ease, text-shadow 0.3s ease;
        }

        .center-grail-btn:hover {
            color: #ffffff;
            transform: scale(1.08);
            text-shadow: 0 0 50px rgba(255, 230, 100, 1), 0 0 20px rgba(255, 255, 255, 0.9);
        }

        .center-grail-text-container.move-top-left {
            top: 7%;
            left: 6%;
            transform: translate(0, 0) scale(0.75);
            filter: brightness(1.3) drop-shadow(0 0 15px rgba(255, 220, 120, 0.9));
            pointer-events: none;
        }

        /* --- 5. 상세 페이지: 좌측 성배 대형 이미지 & 우측 설명 상자 --- */
        .grail-detail-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 25;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-left: 18%;
            gap: 16%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.0s ease-in-out;
        }

        .grail-detail-view.show {
            opacity: 1;
            pointer-events: auto;
        }

        .detail-grail-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .detail-grail-img {
            width: 280px;
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.7));
            animation: grail-gentle-float 3.5s infinite ease-in-out;
        }

        .grail-sub-label {
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 400;
            color: rgba(215, 205, 190, 0.65);
            letter-spacing: 2px;
            user-select: none;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 4px rgba(100, 0, 0, 0.5);
        }

        .detail-description-right {
            flex: 1;
            max-width: 650px;
            background: rgba(15, 0, 0, 0.75);
            border: 2px solid rgba(160, 0, 0, 0.8);
            border-radius: 8px;
            padding: 40px 35px;
            box-shadow: 0 0 25px rgba(100, 0, 0, 0.7), inset 0 0 15px rgba(80, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .description-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f5f0e6;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(180, 0, 0, 0.6);
            padding-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 50, 50, 0.6);
        }

        /* 폰트 크기 1.3배 확대 적용 (1.1rem -> 1.43rem) */
        .description-content {
            font-size: 1.43rem;
            line-height: 1.85;
            color: #d0c5b5;
            letter-spacing: 1px;
            word-break: keep-all;
        }

        /* 클릭 가능한 코토미네 키레이 인용구 레이아웃 */
        .kotomine-quote-box {
            cursor: pointer;
            display: inline-block;
            transition: all 0.3s ease;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .kotomine-quote-box:hover {
            background: rgba(120, 0, 0, 0.35);
            box-shadow: 0 0 12px rgba(255, 30, 30, 0.5);
        }

        .kotomine-quote-box:hover .description-quote {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .kotomine-quote-box:hover .description-quote-author {
            color: #ffcccc;
        }

        .description-quote {
            font-style: italic;
            color: rgba(235, 225, 210, 0.9);
            display: block;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .description-quote-author {
            font-style: normal;
            font-size: 1.15rem;
            color: #a08a75;
            display: block;
            margin-top: 4px;
            text-align: right;
            transition: color 0.3s ease;
        }

        /* --- 6. 화면 좌측 하단 (화살표)뒤로가기 버튼 --- */
        .bottom-left-controls {
            position: absolute;
            bottom: 20px;
            left: 25px;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
        }

        .bottom-left-controls.show {
            opacity: 1;
            pointer-events: auto;
        }

        .fate-back-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.0rem;
            font-weight: 700;
            color: #c0c0c8;
            background: rgba(20, 0, 0, 0.6);
            border: 1px solid rgba(160, 0, 0, 0.7);
            padding: 8px 24px;
            letter-spacing: 2px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 10px rgba(100, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .fate-back-btn:hover {
            color: #ffffff;
            background: rgba(50, 0, 0, 0.8);
            border-color: #ff4444;
            box-shadow: 0 0 18px rgba(255, 50, 50, 0.7);
            transform: scale(1.03);
        }

        /* --- 7. 화면 우측 하단 레이아웃 (SFX/BGM 슬라이더 + 워터마크) --- */
        .bottom-right-controls {
            position: absolute;
            bottom: 20px;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
        }

        .bottom-right-controls.animate {
            pointer-events: auto;
            animation: fade-in 1.2s ease-out forwards;
        }

        .sound-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(15, 0, 0, 0.7);
            border: 1px solid rgba(140, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(80, 0, 0, 0.6);
            backdrop-filter: blur(3px);
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .volume-label {
            font-size: 0.75rem;
            color: #d0c5b5;
            letter-spacing: 1px;
            font-weight: 700;
            user-select: none;
            min-width: 30px;
            text-align: left;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(80, 10, 10, 0.8);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff3333;
            border: 1px solid #ffffff;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
            background: #ff6666;
        }

        .watermark {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1.5px;
            user-select: none;
            margin-top: 2px;
        }

        /* --- 키프레임 애니메이션 정의 --- */

        @keyframes pure-fade-out {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes simple-flash-fade {
            0% { opacity: 1; filter: brightness(1); color: #ffffff; }
            30% { opacity: 1; filter: brightness(5) drop-shadow(0 0 20px #ffffff); color: #ffffff; }
            100% { opacity: 0; filter: brightness(8); color: #ffffff; transform: translateX(2px) scale(0.95); }
        }

        @keyframes slow-blink-loop {
            0% { opacity: 0.2; }
            50% { opacity: 0.85; }
            100% { opacity: 0.2; }
        }

        @keyframes grail-smooth-fadein {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes grail-gentle-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes dust-fade-soft {
            0% { opacity: 0.5; }
            100% { opacity: 0.75; }
        }

        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- BGM & SFX 레이어 -->
    <audio id="bgm" src="main-theme.mp3" loop preload="auto"></audio>
    <audio id="pstSfx" src="pst.mp3" preload="auto"></audio>
    <!-- voice 폴더 경로가 반영된 코토미네 오디오 레이어 -->
    <audio id="kotomineSfx" src="voice/holygrail-kotomine.mp3" preload="auto"></audio>

    <!-- 메인 배경 & 안개 -->
    <div class="main-background-layer" id="bgLayer"></div>
    <div class="red-dust-effect" id="dustEffect"></div>

    <!-- 1단계: [시작하기] UI 버튼 -->
    <div class="start-btn-container" id="btnContainer">
        <button class="fate-start-btn" id="startBtn">시작하기</button>
    </div>

    <!-- 1단계 메인 타이틀 컨텐츠 -->
    <main class="content-container">
        <div class="holy-grail-wrapper" id="grailWrapper">
            <img src="holygrail.png" alt="Holy Grail" class="holy-grail-img">
        </div>

        <h1 class="main-title" id="mainTitle">성배전쟁</h1>
        <p class="sub-title" id="subTitle">온갖 시대, 온갖 나라의 영웅이 현대에 되살아나 힘을 겨루는 살육전</p>

        <div class="press-start-wrapper" id="pressStartWrapper">
            <button class="press-start-btn" id="pressStartBtn">- PRESS TO START -</button>
        </div>
    </main>

    <!-- 메인 화면 좌측 하단 유입자 안내 문구 구역 -->
    <div class="intro-notice-left" id="introNotice">
        ※유입자를 위해 만들어진 사이트이니 생략되거나 스포일러 때문에 진실과는 다르게 설명한 것들이 있을 수 있습니다.
    </div>

    <!-- 2단계: 중앙 클릭 가능한 대형 [성배] 텍스트 -->
    <div class="center-grail-text-container" id="centerGrailWrapper">
        <button class="center-grail-btn" id="centerGrailBtn">성배</button>
    </div>

    <!-- 3단계: 상세뷰 (좌측 대형 성배 이미지 & 우측 설명 상자) -->
    <section class="grail-detail-view" id="grailDetailView">
        <div class="detail-grail-left">
            <img src="holygrail.png" alt="Holy Grail Detail" class="detail-grail-img">
            <span class="grail-sub-label">소(小)성배</span>
        </div>
        <div class="detail-description-right">
            <h2 class="description-title">어떤 소원이라도 이루어주는 원망기(願望器)</h2>
            <div class="description-content">
                <!-- 클릭 시 voice/holygrail-kotomine.mp3 가 재생되는 인터랙티브 박스 -->
                <div class="kotomine-quote-box" id="kotomineTrigger">
                    <span class="description-quote">"성배란, 어떤 소원이라도 이루어주는 원망기다."</span>
                    <span class="description-quote-author">- 코토미네 키레이</span>
                </div>
                <p>성배란 성배전쟁이 일어나기 위한 촉매이다.</p>
                <p style="margin-top: 10px;">성배전쟁은 성배가 7명의 마술사를 마스터로 지정해 령주(令呪)를 부여하고 서번트 소환 자격을 얻는다.</p>
            </div>
        </div>
    </section>

    <!-- 화면 좌측 하단 (화살표)뒤로가기 버튼 -->
    <div class="bottom-left-controls" id="backBtnWrapper">
        <button class="fate-back-btn" id="backBtn">⇦ 뒤로가기</button>
    </div>

    <!-- 화면 우측 하단 컨트롤러 -->
    <div class="bottom-right-controls" id="controlsGroup">
        <div class="sound-panel">
            <div class="volume-control-box">
                <span class="volume-label">SFX</span>
                <input type="range" id="seSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.1">
            </div>
            <div class="volume-control-box">
                <span class="volume-label">BGM</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.1">
            </div>
        </div>
        <footer class="watermark">Made by 사과사과</footer>
    </div>

    <script>
        const bgm = document.getElementById('bgm');
        const pstSfx = document.getElementById('pstSfx');
        const kotomineSfx = document.getElementById('kotomineSfx');
        const volumeSlider = document.getElementById('volumeSlider');
        const seSlider = document.getElementById('seSlider');

        const startBtn = document.getElementById('startBtn');
        const pressStartBtn = document.getElementById('pressStartBtn');
        const centerGrailBtn = document.getElementById('centerGrailBtn');
        const backBtn = document.getElementById('backBtn');
        const kotomineTrigger = document.getElementById('kotomineTrigger');

        const grailWrapper = document.getElementById('grailWrapper');
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');
        const pressStartWrapper = document.getElementById('pressStartWrapper');
        const introNotice = document.getElementById('introNotice');

        const centerGrailWrapper = document.getElementById('centerGrailWrapper');
        const grailDetailView = document.getElementById('grailDetailView');
        const backBtnWrapper = document.getElementById('backBtnWrapper');

        let currentStage = 1;

        volumeSlider.addEventListener('input', function() {
            if (bgm) bgm.volume = parseFloat(this.value);
        });

        seSlider.addEventListener('input', function() {
            if (pstSfx) pstSfx.volume = parseFloat(this.value);
            if (kotomineSfx) kotomineSfx.volume = parseFloat(this.value);
        });

        seSlider.addEventListener('change', function() {
            if (pstSfx) {
                pstSfx.currentTime = 0;
                pstSfx.play().catch(e => console.log(e));
            }
        });

        // 코토미네 키레이 대사 클릭 이벤트: voice/holygrail-kotomine.mp3 재생
        kotomineTrigger.addEventListener('click', function() {
            if (kotomineSfx) {
                kotomineSfx.volume = parseFloat(seSlider.value);
                kotomineSfx.currentTime = 0;
                kotomineSfx.play().catch(e => console.log("코토미네 음원 재생 예외 발생:", e));
            }
        });

        pressStartBtn.addEventListener('click', function() {
            if (pstSfx) {
                pstSfx.volume = parseFloat(seSlider.value);
                pstSfx.currentTime = 0;
                pstSfx.play().catch(e => console.log(e));
            }

            pressStartWrapper.classList.add('flash-exit');

            setTimeout(() => {
                grailWrapper.classList.add('slow-fade-out');
                mainTitle.classList.add('slow-fade-out');
                subTitle.classList.add('slow-fade-out');
                introNotice.classList.add('slow-fade-out');
            }, 250);

            setTimeout(() => {
                centerGrailWrapper.classList.add('show');
                backBtnWrapper.classList.add('show');
                currentStage = 2;
            }, 1450);
        });

        centerGrailBtn.addEventListener('click', function() {
            if (pstSfx) {
                pstSfx.currentTime = 0;
                pstSfx.play().catch(e => console.log(e));
            }

            centerGrailWrapper.classList.add('move-top-left');

            setTimeout(() => {
                grailDetailView.classList.add('show');
                currentStage = 3;
            }, 300);
        });

        backBtn.addEventListener('click', function() {
            if (pstSfx) {
                pstSfx.currentTime = 0;
                pstSfx.play().catch(e => console.log(e));
            }

            // 페이지 이탈 시 재생 중인 코토미네 보이스 정지
            if (kotomineSfx) {
                kotomineSfx.pause();
                kotomineSfx.currentTime = 0;
            }

            if (currentStage === 3) {
                grailDetailView.classList.remove('show');
                setTimeout(() => {
                    centerGrailWrapper.classList.remove('move-top-left');
                    currentStage = 2;
                }, 300);

            } else if (currentStage === 2) {
                centerGrailWrapper.classList.remove('show');
                backBtnWrapper.classList.remove('show');

                setTimeout(() => {
                    grailWrapper.classList.remove('slow-fade-out');
                    mainTitle.classList.remove('slow-fade-out');
                    subTitle.classList.remove('slow-fade-out');
                    introNotice.classList.remove('slow-fade-out');
                }, 300);

                setTimeout(() => {
                    pressStartWrapper.classList.remove('flash-exit');
                    pressStartWrapper.style.opacity = '0';
                    void pressStartWrapper.offsetWidth;
                    pressStartWrapper.style.opacity = '1';
                    pressStartWrapper.style.pointerEvents = 'auto';
                    currentStage = 1;
                }, 800);
            }
        });

        startBtn.addEventListener('click', function() {
            const btnContainer = document.getElementById('btnContainer');
            const bgLayer = document.getElementById('bgLayer');
            const dustEffect = document.getElementById('dustEffect');
            const controlsGroup = document.getElementById('controlsGroup');

            btnContainer.classList.add('hide');

            if (bgm) {
                bgm.volume = parseFloat(volumeSlider.value);
                setTimeout(() => {
                    bgm.play().catch(e => console.log(e));
                }, 700);
            }

            if (pstSfx) pstSfx.volume = parseFloat(seSlider.value);
            if (kotomineSfx) kotomineSfx.volume = parseFloat(seSlider.value);

            setTimeout(() => bgLayer.classList.add('active'), 300);
            setTimeout(() => dustEffect.classList.add('active'), 500);
            setTimeout(() => grailWrapper.classList.add('animate'), 1400);
            setTimeout(() => mainTitle.classList.add('animate'), 2200);

            setTimeout(() => {
                subTitle.classList.add('animate');
                introNotice.classList.add('animate');
                controlsGroup.classList.add('animate');
            }, 2800);

            setTimeout(() => pressStartWrapper.classList.add('animate'), 3500);
        });
    </script>
</body>
</html>
