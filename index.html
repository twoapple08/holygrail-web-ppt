<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate/series</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-color: #000000;
        }

        /* 메인 배경 이미지 */
        .main-background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('first-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
        }

        .main-background-layer.active {
            opacity: 1;
        }

        /* 붉은 먼지/안개 이펙트 */
        .red-dust-effect {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(to top, rgba(140, 10, 10, 0.35) 0%, rgba(70, 0, 0, 0.15) 50%, transparent 100%);
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.8s ease-in-out;
        }

        .red-dust-effect.active {
            opacity: 0.55;
            animation: dust-fade-soft 5s infinite alternate ease-in-out 1.8s;
        }

        @keyframes dust-fade-soft {
            0% { opacity: 0.5; }
            100% { opacity: 0.75; }
        }

        /* 신규개념 획득 토스트 알림 */
        #acquireToastContainer {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            pointer-events: none;
            width: 100%;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 10px;
        }

        .word-toast-item {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            opacity: 0;
            animation: float-fade-smooth 1.8s forwards linear;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 5px rgba(255, 215, 0, 0.6);
            user-select: none;
            white-space: nowrap;
        }

        @keyframes float-fade-smooth {
            0% { transform: translateY(35px); opacity: 0; }
            50% { transform: translateY(0px); opacity: 1; }
            100% { transform: translateY(-35px); opacity: 0; }
        }

        /* 하이라이트 상호작용 키워드 */
        .interactive-keyword {
            color: #ffd700 !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            pointer-events: auto !important;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
            transition: color 0.3s ease, text-shadow 0.3s ease;
            user-select: none;
            display: inline-block;
            position: relative;
            z-index: 1000;
        }

        .interactive-keyword:hover {
            color: #ffffff !important;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
        }

        .interactive-keyword.clicked {
            color: #d0c5b5 !important;
            font-weight: 400 !important;
            cursor: default !important;
            text-shadow: none !important;
            pointer-events: none !important;
        }

        /* 어록 스타일 (클릭 100% 보장) */
        .description-quote {
            font-style: italic;
            color: rgba(200, 190, 175, 0.75);
            display: inline-block;
            cursor: pointer !important;
            pointer-events: auto !important;
            position: relative;
            z-index: 1000;
            user-select: none;
            animation: quote-gentle-glow 2.5s infinite alternate ease-in-out;
            transition: color 0.3s ease, transform 0.2s ease, text-shadow 0.3s ease;
        }

        .description-quote:hover {
            color: #ffffff !important;
            transform: scale(1.02);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 255, 255, 0.6) !important;
        }

        .description-quote.glow-fade-out {
            animation: none !important;
            text-shadow: none !important;
        }

        @keyframes quote-gentle-glow {
            0% { text-shadow: 0 0 3px rgba(200, 190, 175, 0.2); }
            100% { text-shadow: 0 0 10px rgba(220, 210, 195, 0.5), 0 0 16px rgba(200, 190, 175, 0.3); }
        }

        /* --- 1. 시작 컨테이너 --- */
        .start-btn-container {
            position: absolute;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 70px;
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        .fate-start-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #f5f0e6;
            background: rgba(20, 0, 0, 0.85);
            border: 2px solid #900000;
            padding: 16px 48px;
            letter-spacing: 6px;
            margin-right: -6px;
            cursor: pointer;
            outline: none;
            position: relative;
            box-shadow: 0 0 15px rgba(140, 0, 0, 0.6), inset 0 0 10px rgba(100, 0, 0, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .fate-start-btn:hover {
            color: #ffffff;
            background: rgba(60, 0, 0, 0.95);
            border-color: #ff2222;
            box-shadow: 0 0 25px rgba(255, 30, 30, 0.9), inset 0 0 15px rgba(180, 0, 0, 0.8);
            transform: scale(1.05);
        }

        .start-btn-container.hide {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .initial-notice-center {
            font-size: 0.95rem;
            color: rgba(215, 205, 190, 0.7);
            letter-spacing: 1.5px;
            user-select: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 5px rgba(100, 0, 0, 0.8);
            transition: opacity 0.6s ease-out;
            pointer-events: none;
        }

        /* --- 메인 화면 텍스트/로고 --- */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
            pointer-events: none;
            transform: translateY(-10px);
        }

        .holy-grail-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            opacity: 0;
        }

        .holy-grail-wrapper.animate {
            animation: grail-smooth-fadein 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .fate-logo-img {
            width: 270px;
            height: auto;
            animation: grail-gentle-float 3s infinite ease-in-out;
            filter: drop-shadow(0 0 22px rgba(200, 20, 20, 0.85));
        }

        .sub-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1.5px;
            line-height: 1.6;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 2px 10px rgba(0, 0, 0, 1);
            margin-bottom: 35px;
            opacity: 0;
        }

        .sub-title.animate {
            animation: fade-in 1.0s ease-out forwards;
        }

        .press-start-wrapper {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-out;
        }

        .press-start-wrapper.animate {
            opacity: 1;
            pointer-events: auto;
        }

        .press-start-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #a0a0aa;
            letter-spacing: 5px;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 0 5px rgba(100, 100, 110, 0.5);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: color 0.3s ease, text-shadow 0.3s ease, transform 0.2s ease;
            animation: slow-blink-loop 2.8s infinite alternate ease-in-out;
        }

        .press-start-btn:hover {
            animation-play-state: paused !important;
            opacity: 1 !important;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 8px rgba(255, 255, 255, 0.9);
            transform: scale(1.08);
        }

        .press-start-wrapper.flash-exit {
            animation: simple-flash-fade 0.25s ease-out forwards !important;
            pointer-events: none !important;
        }

        .slow-fade-out {
            animation: pure-fade-out 1.2s ease-out forwards !important;
            pointer-events: none !important;
        }

        /* 유입자 안내 문구 */
        .intro-notice-left {
            position: absolute;
            bottom: 25px;
            left: 25px;
            z-index: 20;
            max-width: 500px;
            font-size: 1.05rem;
            color: rgba(230, 220, 205, 0.65);
            letter-spacing: 1px;
            line-height: 1.45;
            user-select: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 5px rgba(100, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            word-break: keep-all;
        }

        .intro-notice-left.animate {
            animation: fade-in 1.2s ease-out forwards;
        }
        .intro-notice-left.slow-fade-out {
            animation: pure-fade-out 1.2s ease-out forwards !important;
        }

        /* --- 4. 마인드맵 트리 컨테이너 (순수 페이드 전환) --- */
        .tree-selection-container {
            position: absolute;
            z-index: 30;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
        }

        .tree-selection-container.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* 트리 가지 (SVG Lines) */
        .tree-svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 31;
        }

        .tree-branch-line {
            stroke-width: 4px;
            fill: none;
            filter: drop-shadow(0 0 10px rgba(139, 0, 0, 0.6)); /* 짙은 붉은색 그림자 */
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .tree-branch-line.drawn {
            opacity: 1;
        }

        /* 트리 노드 (탭 버튼) */
        .tree-node-box {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 34;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tab-item-btn {
            font-family: 'Song Myung', serif;
            font-weight: 700;
            color: #fffdfa;
            letter-spacing: 12px;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 40px rgba(255, 215, 0, 0.8);
            transition: transform 0.3s ease, color 0.3s ease, text-shadow 0.3s ease;
        }

        .tab-item-btn:hover {
            color: #ffffff;
            transform: scale(1.08);
            text-shadow: 0 0 50px rgba(255, 230, 100, 1), 0 0 20px rgba(255, 255, 255, 0.9);
        }

        /* --- 5. 상세 뷰 컨테이너 (순수 페이드 전환) --- */
        .tab-detail-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 25; 
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-left: 18%;
            gap: 16%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
        }

        .tab-detail-view.show {
            z-index: 55 !important;
            opacity: 1;
            pointer-events: auto;
        }

        /* 정적 탭 타이틀 */
        .static-tab-title {
            position: absolute;
            top: 7vh;
            left: 6vw;
            font-family: 'Song Myung', serif;
            font-size: 4.5rem;
            font-weight: 700;
            color: #fffdfa;
            letter-spacing: 12px;
            white-space: nowrap;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 40px rgba(255, 215, 0, 0.8);
            transform-origin: top left;
            transform: scale(0.75);
            filter: brightness(1.3) drop-shadow(0 0 15px rgba(255, 220, 120, 0.9));
            pointer-events: none;
            z-index: 10;
        }

        .detail-left-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 280px;
        }

        .detail-img {
            width: 280px;
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.7));
            animation: grail-gentle-float 3.5s infinite ease-in-out;
        }

        .detail-sub-label {
            margin-top: 15px;
            font-size: 0.95rem;
            color: rgba(215, 205, 190, 0.65);
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 4px rgba(100, 0, 0, 0.5);
        }

        .detail-right-box {
            flex: 1;
            max-width: 650px;
            background: rgba(15, 0, 0, 0.75);
            border: 2px solid rgba(160, 0, 0, 0.8);
            border-radius: 8px;
            padding: 30px 35px 40px 35px;
            box-shadow: 0 0 25px rgba(100, 0, 0, 0.7), inset 0 0 15px rgba(80, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            position: relative;
            z-index: 5;
            pointer-events: auto;
        }

        .description-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #f5f0e6;
            letter-spacing: 2px;
            margin-top: -6px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(180, 0, 0, 0.6);
            padding-bottom: 12px;
            text-shadow: 0 0 12px rgba(255, 50, 50, 0.7);
        }

        .description-content {
            font-size: 1.43rem;
            line-height: 1.85;
            color: #d0c5b5;
            letter-spacing: 1px;
            word-break: keep-all;
        }

        .description-quote-author {
            font-style: normal;
            font-size: 1.15rem;
            color: #a08a75;
            display: block;
            margin-top: 4px;
            margin-bottom: 16px;
            text-align: right;
            user-select: none;
        }

        /* --- 6. 뒤로가기 버튼 --- */
        .bottom-left-controls {
            position: absolute;
            bottom: 20px;
            left: 25px;
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
        }

        .bottom-left-controls.show {
            opacity: 1;
            pointer-events: auto;
        }

        .fate-back-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.0rem;
            font-weight: 700;
            color: #c0c0c8;
            background: rgba(20, 0, 0, 0.6);
            border: 1px solid rgba(160, 0, 0, 0.7);
            padding: 8px 24px;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(100, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .fate-back-btn:hover {
            color: #ffffff;
            background: rgba(50, 0, 0, 0.8);
            border-color: #ff4444;
            box-shadow: 0 0 18px rgba(255, 50, 50, 0.7);
            transform: scale(1.03);
        }

        /* --- 7. 우측 하단 컨트롤러 --- */
        .bottom-right-controls {
            position: absolute;
            bottom: 20px;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 60;
            opacity: 0;
            pointer-events: none;
        }

        .bottom-right-controls.animate {
            pointer-events: auto;
            animation: fade-in 1.2s ease-out forwards;
        }

        .sound-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(15, 0, 0, 0.7);
            border: 1px solid rgba(140, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 4px;
            backdrop-filter: blur(3px);
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .volume-label {
            font-size: 0.75rem;
            color: #d0c5b5;
            font-weight: 700;
            user-select: none;
            min-width: 40px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(80, 10, 10, 0.8);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff3333;
            border: 1px solid #ffffff;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
            background: #ff6666;
        }

        .watermark {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1.5px;
            user-select: none;
            margin-top: 2px;
        }

        @keyframes pure-fade-out { 0% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes simple-flash-fade {
            0% { opacity: 1; filter: brightness(1); color: #ffffff; }
            30% { opacity: 1; filter: brightness(5) drop-shadow(0 0 20px #ffffff); color: #ffffff; }
            100% { opacity: 0; filter: brightness(8); color: #ffffff; transform: translateX(2px) scale(0.95); }
        }
        @keyframes slow-blink-loop { 0% { opacity: 0.2; } 50% { opacity: 0.85; } 100% { opacity: 0.2; } }
        @keyframes grail-smooth-fadein { 0% { opacity: 0; transform: scale(0.96); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes grail-gentle-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes fade-in { 0% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="acquireToastContainer"></div>

    <audio id="bgm" src="main-theme.mp3" loop preload="auto"></audio>
    <audio id="pstSfx" src="sfx/sfx-pst.mp3" preload="auto"></audio>
    <audio id="wordSfx" src="sfx/sfx-word.mp3" preload="auto"></audio>
    <audio id="noshinSfx" src="sfx/sfx-noshin.mp3" preload="auto"></audio>
    <audio id="kotomineSfx" src="voice/holygrail-kotomine.mp3" preload="auto"></audio>

    <div class="main-background-layer" id="bgLayer"></div>
    <div class="red-dust-effect" id="dustEffect"></div>

    <div class="start-btn-container" id="btnContainer">
        <button class="fate-start-btn" id="startBtn">시작하기</button>
        <div class="initial-notice-center" id="initialNotice">
            ※이 사이트는 컴퓨터 전체화면을 기준으로 제작되었습니다.
        </div>
    </div>

    <main class="content-container">
        <div class="holy-grail-wrapper" id="grailWrapper">
            <img src="Fate.png" alt="Fate Logo" class="fate-logo-img">
        </div>
        <p class="sub-title" id="subTitle">성배와 영령<span class="extended-dash">—</span>그리고 운명의 이야기</p>
        <div class="press-start-wrapper" id="pressStartWrapper">
            <button class="press-start-btn" id="pressStartBtn">- PRESS TO START -</button>
        </div>
    </main>

    <div class="intro-notice-left" id="introNotice">
        ※유입자를 위해 만들어진 사이트이니 생략되거나 스포일러 때문에 진실과는 다르게 설명한 것들이 있을 수 있습니다.
    </div>

    <!-- 트리 마인드맵 컨테이너 -->
    <div class="tree-selection-container" id="treeSelectionContainer">
        <svg class="tree-svg-layer" id="treeSvg"></svg>
        <div id="treeNodesBox"></div>
    </div>

    <!-- 동적 탭 보관소 -->
    <div id="dynamicTabDetailViews">
        <!-- 기본 성배 상세 뷰 -->
        <section class="tab-detail-view" id="tabDetail_sung">
            <div class="static-tab-title">성배</div>
            <div class="detail-left-box">
                <img src="holygrail.png" alt="Holy Grail Detail" class="detail-img">
                <span class="detail-sub-label">소(小)성배</span>
            </div>
            <div class="detail-right-box">
                <h2 class="description-title">성배란?</h2>
                <div class="description-content">
                    <span class="description-quote" id="kotomineTrigger">"성배란, 어떤 소원이라도 이루어주는 원망기다."</span>
                    <span class="description-quote-author">- 코토미네 키레이</span>
                    <p style="margin-top: 12px;">성배란 <span class="interactive-keyword" data-key="sungbwar">성배전쟁</span>이 일어나기 위한 촉매이다.</p>
                </div>
            </div>
        </section>
    </div>

    <div class="bottom-left-controls" id="backBtnWrapper">
        <button class="fate-back-btn" id="backBtn">⇦ 뒤로가기</button>
    </div>

    <div class="bottom-right-controls" id="controlsGroup">
        <div class="sound-panel">
            <div class="volume-control-box">
                <span class="volume-label">SFX</span>
                <input type="range" id="seSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.1">
            </div>
            <div class="volume-control-box">
                <span class="volume-label">BGM</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.1">
            </div>
            <div class="volume-control-box">
                <span class="volume-label">VOICE</span>
                <input type="range" id="voiceSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.3">
            </div>
        </div>
        <footer class="watermark">Made by 사과사과</footer>
    </div>

    <script>
        // ★ 마인드맵 트리 데이터베이스 ★
        const CONCEPT_REGISTRY = {
            'sung': { name: '성배', parent: null },
            'sungbwar': { name: '성배전쟁', parent: 'sung' }
        };

        // 탭별 상세뷰 내용 데이터베이스
        const DETAIL_CONTENT = {
            'sungbwar': `
                <div class="detail-left-box">
                    <span class="detail-sub-label">의식의 룰</span>
                </div>
                <div class="detail-right-box">
                    <h2 class="description-title">성배전쟁이란?</h2>
                    <div class="description-content">
                        <p>성배를 차지하기 위해 일곱 명의 마술사가 일곱 기의 서번트를 소환하여 벌이는 피의 살육전이다.</p>
                    </div>
                </div>`
        };

        // 초기화 보호 모듈
        (function checkReloadAndReset() {
            const navEntries = performance.getEntriesByType('navigation');
            const isReload = (navEntries.length > 0 && navEntries[0].type === 'reload') || 
                             (performance.navigation && performance.navigation.type === 1);
            if (isReload) {
                Object.keys(CONCEPT_REGISTRY).forEach(id => sessionStorage.removeItem('fate_concept_' + id));
                sessionStorage.removeItem('fate_concept_order');
            }
        })();

        document.addEventListener('DOMContentLoaded', function() {
            if (!history.state || history.state.stage !== 1) {
                history.replaceState({ stage: 1 }, '', '');
            }

            sessionStorage.setItem('fate_concept_sung', 'true');
            let conceptOrder = JSON.parse(sessionStorage.getItem('fate_concept_order') || '[]');
            if (!conceptOrder.includes('sung')) {
                conceptOrder.push('sung');
                sessionStorage.setItem('fate_concept_order', JSON.stringify(conceptOrder));
            }

            const bgm = document.getElementById('bgm');
            const pstSfx = document.getElementById('pstSfx');
            const wordSfx = document.getElementById('wordSfx');
            const noshinSfx = document.getElementById('noshinSfx');
            const kotomineSfx = document.getElementById('kotomineSfx');

            const volumeSlider = document.getElementById('volumeSlider');
            const seSlider = document.getElementById('seSlider');
            const voiceSlider = document.getElementById('voiceSlider');

            const startBtn = document.getElementById('startBtn');
            const pressStartBtn = document.getElementById('pressStartBtn');
            const backBtn = document.getElementById('backBtn');
            const acquireToastContainer = document.getElementById('acquireToastContainer');

            const grailWrapper = document.getElementById('grailWrapper');
            const subTitle = document.getElementById('subTitle');
            const pressStartWrapper = document.getElementById('pressStartWrapper');
            const introNotice = document.getElementById('introNotice');

            const treeSelectionContainer = document.getElementById('treeSelectionContainer');
            const treeSvg = document.getElementById('treeSvg');
            const treeNodesBox = document.getElementById('treeNodesBox');
            const dynamicTabDetailViews = document.getElementById('dynamicTabDetailViews');
            const backBtnWrapper = document.getElementById('backBtnWrapper');

            let currentStage = 1;
            let currentActiveTabId = null;
            let activeToastCount = 0;

            volumeSlider.addEventListener('input', function() { if (bgm) bgm.volume = parseFloat(this.value); });
            seSlider.addEventListener('input', function() {
                if (pstSfx) pstSfx.volume = parseFloat(this.value);
                if (wordSfx) wordSfx.volume = Math.min(1, parseFloat(this.value) * 4.0);
                if (noshinSfx) noshinSfx.volume = parseFloat(this.value);
            });
            voiceSlider.addEventListener('input', function() { if (kotomineSfx) kotomineSfx.volume = parseFloat(this.value); });

            seSlider.addEventListener('change', function() {
                if (pstSfx) { pstSfx.currentTime = 0; pstSfx.play().catch(()=>{}); }
            });

            // ★ 전역 오디오 락오프 해제 엔진 (100% 가동 보장) ★
            let isAudioUnlocked = false;
            function unlockAllAudioPolicy() {
                if (isAudioUnlocked) return;
                [bgm, pstSfx, wordSfx, noshinSfx, kotomineSfx].forEach(audio => {
                    if (audio) {
                        const originalVol = audio.volume;
                        audio.volume = 0; 
                        const playPromise = audio.play();
                        if (playPromise !== undefined) {
                            playPromise.then(() => {
                                audio.pause();
                                audio.currentTime = 0;
                                audio.volume = originalVol;
                            }).catch(() => {});
                        }
                    }
                });
                isAudioUnlocked = true;
                document.removeEventListener('pointerdown', unlockAllAudioPolicy);
                document.removeEventListener('click', unlockAllAudioPolicy);
            }
            document.addEventListener('pointerdown', unlockAllAudioPolicy, { once: true });
            document.addEventListener('click', unlockAllAudioPolicy, { once: true });

            // ★ 어록 터치/클릭 100% 재생 전역 위임엔진 ★
            document.addEventListener('click', function(e) {
                const quoteTarget = e.target.closest('#kotomineTrigger');
                if (quoteTarget) {
                    e.preventDefault();
                    if (!quoteTarget.classList.contains('glow-fade-out')) {
                        quoteTarget.classList.add('glow-fade-out');
                    }
                    if (kotomineSfx) {
                        kotomineSfx.volume = parseFloat(voiceSlider.value);
                        kotomineSfx.currentTime = 0;
                        kotomineSfx.play().catch(()=>{});
                    }
                }
            });

            function spawnAcquireToast(wordText) {
                activeToastCount++;
                const toastEl = document.createElement('div');
                toastEl.className = 'word-toast-item';
                toastEl.innerText = `—${wordText}을(를) 획득했습니다—`;
                acquireToastContainer.appendChild(toastEl);

                setTimeout(() => {
                    if (toastEl && toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
                    activeToastCount = Math.max(0, activeToastCount - 1);
                }, 1800);
            }

            // ★ 고유번호 획득 검증 및 동적 추가 연산 ★
            document.addEventListener('click', function(e) {
                const keyTarget = e.target.closest('.interactive-keyword');
                if (keyTarget) {
                    e.preventDefault();
                    
                    if (activeToastCount > 0) {
                        if (noshinSfx) {
                            noshinSfx.volume = parseFloat(seSlider.value);
                            noshinSfx.currentTime = 0;
                            noshinSfx.play().catch(()=>{});
                        }
                        return;
                    }

                    if (!keyTarget.classList.contains('clicked')) {
                        keyTarget.classList.add('clicked');
                        const id = keyTarget.getAttribute('data-key');
                        
                        sessionStorage.setItem('fate_concept_' + id, 'true');

                        let orderList = JSON.parse(sessionStorage.getItem('fate_concept_order') || '[]');
                        if (!orderList.includes(id)) {
                            orderList.push(id);
                            sessionStorage.setItem('fate_concept_order', JSON.stringify(orderList));
                        }

                        if (wordSfx) {
                            wordSfx.volume = Math.min(1, parseFloat(seSlider.value) * 4.0);
                            wordSfx.currentTime = 0;
                            wordSfx.play().catch(()=>{});
                        }
                        spawnAcquireToast(keyTarget.innerText.trim());
                    }
                }
            });

            // 정적 타이틀이 포함된 상세 뷰 자동 생성 모듈
            function ensureDetailViewExists(id) {
                if (!document.getElementById('tabDetail_' + id)) {
                    const section = document.createElement('section');
                    section.className = 'tab-detail-view';
                    section.id = 'tabDetail_' + id;
                    
                    section.innerHTML = `
                        <div class="static-tab-title">${CONCEPT_REGISTRY[id].name}</div>
                        ${DETAIL_CONTENT[id] || ''}
                    `;
                    dynamicTabDetailViews.appendChild(section);

                    const keywords = section.querySelectorAll('.interactive-keyword');
                    keywords.forEach(kw => {
                        const kwId = kw.getAttribute('data-key');
                        if (sessionStorage.getItem('fate_concept_' + kwId) === 'true') {
                            kw.classList.add('clicked');
                        }
                    });
                }
            }

            // ★ 고유번호 획득 기반 마인드맵 & 동적 SVG 그라데이션 렌더링 엔진 ★
            function renderTreeGrid() {
                treeSvg.innerHTML = '<defs></defs>';
                const svgDefs = treeSvg.querySelector('defs');
                treeNodesBox.innerHTML = '';
                
                const orderList = JSON.parse(sessionStorage.getItem('fate_concept_order') || '[]');
                const unlockedIds = orderList.filter(id => sessionStorage.getItem('fate_concept_' + id) === 'true' && CONCEPT_REGISTRY[id]);

                const levels = [];
                function assignLevel(id, depth) {
                    if (!levels[depth]) levels[depth] = [];
                    if (!levels[depth].includes(id)) levels[depth].push(id);
                    
                    const children = unlockedIds.filter(childId => CONCEPT_REGISTRY[childId].parent === id);
                    children.forEach(childId => assignLevel(childId, depth + 1));
                }
                
                if (unlockedIds.includes('sung')) assignLevel('sung', 0);

                const positions = {}; 

                levels.forEach((levelNodes, depth) => {
                    const yPercent = 20 + (depth * 30); 
                    
                    levelNodes.forEach((id, index) => {
                        const xPercent = (100 / (levelNodes.length + 1)) * (index + 1); 
                        positions[id] = { x: xPercent, y: yPercent };

                        const nodeBox = document.createElement('div');
                        nodeBox.className = 'tree-node-box';
                        nodeBox.style.left = xPercent + '%';
                        nodeBox.style.top = yPercent + '%';

                        const btn = document.createElement('button');
                        btn.className = 'tab-item-btn';
                        btn.style.fontSize = (4.5 - (depth * 0.5)) + 'rem';
                        btn.innerText = CONCEPT_REGISTRY[id].name;
                        
                        // ★ 순수 페이드인 아웃 클릭 연산 적용 ★
                        btn.onclick = () => {
                            history.pushState({ stage: 3, id: id }, '', '');
                            if (pstSfx) { 
                                pstSfx.volume = parseFloat(seSlider.value);
                                pstSfx.currentTime = 0; 
                                pstSfx.play().catch(()=>{}); 
                            }
                            
                            currentActiveTabId = id;
                            treeSelectionContainer.classList.remove('show');
                            
                            const targetView = document.getElementById('tabDetail_' + id);
                            if (targetView) {
                                setTimeout(() => {
                                    targetView.classList.add('show');
                                    currentStage = 3;
                                }, 600); // 0.6초간 완벽히 페이드아웃 후, 0.6초간 페이드인
                            }
                        };

                        nodeBox.appendChild(btn);
                        treeNodesBox.appendChild(nodeBox);
                        ensureDetailViewExists(id);
                    });
                });

                unlockedIds.forEach(id => {
                    const parentId = CONCEPT_REGISTRY[id].parent;
                    if (parentId && positions[parentId] && positions[id]) {
                        // 그라데이션 동적 생성 (양 끝단이 자연스럽게 페이드아웃됨)
                        const gradId = `fadeGrad_${parentId}_${id}`;
                        const linearGrad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                        linearGrad.setAttribute('id', gradId);
                        linearGrad.setAttribute('gradientUnits', 'userSpaceOnUse');
                        linearGrad.setAttribute('x1', positions[parentId].x + '%');
                        linearGrad.setAttribute('y1', positions[parentId].y + '%');
                        linearGrad.setAttribute('x2', positions[id].x + '%');
                        linearGrad.setAttribute('y2', positions[id].y + '%');

                        const stopsData = [
                            { offset: '0%', opacity: '0' },
                            { offset: '22%', opacity: '1' },
                            { offset: '78%', opacity: '1' },
                            { offset: '100%', opacity: '0' }
                        ];

                        stopsData.forEach(data => {
                            const stop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                            stop.setAttribute('offset', data.offset);
                            stop.setAttribute('stop-color', '#8B0000'); // 짙은 붉은색
                            stop.setAttribute('stop-opacity', data.opacity);
                            linearGrad.appendChild(stop);
                        });
                        svgDefs.appendChild(linearGrad);

                        // 마력 생명선 렌더링
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('class', 'tree-branch-line');
                        line.setAttribute('x1', positions[parentId].x + '%');
                        line.setAttribute('y1', positions[parentId].y + '%');
                        line.setAttribute('x2', positions[id].x + '%');
                        line.setAttribute('y2', positions[id].y + '%');
                        line.setAttribute('stroke', `url(#${gradId})`);
                        treeSvg.appendChild(line);
                        
                        setTimeout(() => {
                            line.classList.add('drawn');
                        }, 100);
                    }
                });
            }

            // --- 단계별 상태 트랜지션 (크로스 페이드) ---
            pressStartBtn.addEventListener('click', function() {
                history.pushState({ stage: 2 }, '', '');
                if (pstSfx) {
                    pstSfx.volume = parseFloat(seSlider.value);
                    pstSfx.currentTime = 0;
                    pstSfx.play().catch(()=>{});
                }

                pressStartWrapper.classList.add('flash-exit');
                setTimeout(() => {
                    grailWrapper.classList.add('slow-fade-out');
                    subTitle.classList.add('slow-fade-out');
                    introNotice.classList.add('slow-fade-out');
                }, 250);

                setTimeout(() => {
                    renderTreeGrid();
                    treeSelectionContainer.classList.add('show');
                    backBtnWrapper.classList.add('show');
                    currentStage = 2;
                }, 1450);
            });

            backBtn.addEventListener('click', function() { history.back(); });

            // ★ 뒤로가기 모션 역시 순수 페이드 인아웃 동기화 ★
            window.addEventListener('popstate', function(event) {
                const targetStage = (event.state && event.state.stage) ? event.state.stage : 1;
                if (targetStage >= currentStage) return;

                if (pstSfx) { 
                    pstSfx.volume = parseFloat(seSlider.value);
                    pstSfx.currentTime = 0; 
                    pstSfx.play().catch(()=>{}); 
                }
                if (kotomineSfx) { kotomineSfx.pause(); kotomineSfx.currentTime = 0; }

                if (currentStage === 3) {
                    currentStage = targetStage;
                    const activeView = document.getElementById('tabDetail_' + currentActiveTabId);
                    if (activeView) activeView.classList.remove('show');

                    setTimeout(() => {
                        if (targetStage === 2) {
                            renderTreeGrid();
                            treeSelectionContainer.classList.add('show');
                        }
                        if (targetStage === 1) {
                            backBtnWrapper.classList.remove('show');
                            grailWrapper.classList.remove('slow-fade-out');
                            subTitle.classList.remove('slow-fade-out');
                            introNotice.classList.remove('slow-fade-out');
                            pressStartWrapper.classList.remove('flash-exit');
                            pressStartWrapper.style.opacity = '1';
                            pressStartWrapper.style.pointerEvents = 'auto';
                        }
                        currentActiveTabId = null;
                    }, 600); // 0.6초 대기 후 교차 페이드인

                } else if (currentStage === 2 && targetStage === 1) {
                    currentStage = 1;
                    treeSelectionContainer.classList.remove('show');
                    backBtnWrapper.classList.remove('show');

                    setTimeout(() => {
                        grailWrapper.classList.remove('slow-fade-out');
                        subTitle.classList.remove('slow-fade-out');
                        introNotice.classList.remove('slow-fade-out');
                    }, 300);

                    setTimeout(() => {
                        pressStartWrapper.classList.remove('flash-exit');
                        pressStartWrapper.style.opacity = '0';
                        void pressStartWrapper.offsetWidth;
                        pressStartWrapper.style.opacity = '1';
                        pressStartWrapper.style.pointerEvents = 'auto';
                    }, 800);
                }
            });

            startBtn.addEventListener('click', function() {
                unlockAllAudioPolicy(); // 시작 시 확실한 오디오 정책 락오프
                
                const btnContainer = document.getElementById('btnContainer');
                const bgLayer = document.getElementById('bgLayer');
                const dustEffect = document.getElementById('dustEffect');
                const controlsGroup = document.getElementById('controlsGroup');

                btnContainer.classList.add('hide');

                if (bgm) {
                    bgm.volume = parseFloat(volumeSlider.value);
                    setTimeout(() => { bgm.play().catch(()=>{}); }, 700);
                }

                if (pstSfx) pstSfx.volume = parseFloat(seSlider.value);
                if (wordSfx) wordSfx.volume = Math.min(1, parseFloat(seSlider.value) * 4.0);
                if (noshinSfx) noshinSfx.volume = parseFloat(seSlider.value);
                if (kotomineSfx) kotomineSfx.volume = parseFloat(voiceSlider.value);

                setTimeout(() => bgLayer.classList.add('active'), 300);
                setTimeout(() => dustEffect.classList.add('active'), 500);
                setTimeout(() => grailWrapper.classList.add('animate'), 1400);

                setTimeout(() => {
                    subTitle.classList.add('animate');
                    introNotice.classList.add('animate');
                    controlsGroup.classList.add('animate');
                }, 2200);

                setTimeout(() => pressStartWrapper.classList.add('animate'), 3000);
            });
        });
    </script>
</body>
</html>
