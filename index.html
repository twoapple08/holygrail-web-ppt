<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성배전쟁 - Fate/stay night 테마</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-image: url('first-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
        }

        /* 묵직한 카메라 셰이크 */
        body.shake-active {
            animation: camera-impact 0.45s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 배경 마력 오라 레이어 */
        .background-aura {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(80, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.6) 80%);
            z-index: 1;
            animation: pulse-aura 4s infinite alternate ease-in-out;
            pointer-events: none;
        }

        /* 화면 아래 붉은 먼지 안개 */
        .red-dust-effect {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(to top, rgba(140, 10, 10, 0.45) 0%, rgba(80, 0, 0, 0.2) 50%, transparent 100%);
            z-index: 2;
            pointer-events: none;
            animation: dust-fade 6s infinite alternate ease-in-out;
        }

        /* --- 고급 비네트 컷신 연출 --- */

        /* 화면 테두리부터 부드럽게 붉은 마력이 차오르는 비네트 충전 레이어 */
        .vignette-red-charge {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px rgba(180, 0, 20, 0.9), inset 0 0 50px rgba(100, 0, 0, 1);
            z-index: 22;
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            animation: vignette-pulse-charge 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* 빵! 터지며 순간적으로 화면을 강타하는 딥 레드 섬광 오버레이 */
        .impact-flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ffffff 0%, #aa0015 60%, #400000 100%);
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            animation: impact-flash 0.5s ease-out 1.1s forwards;
        }

        /* 컨텐츠 컨테이너 */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
            background: transparent;
            margin: 0 auto;
        }

        /* 성배 이미지: 섬광과 동시에 부드럽고 묵직하게 안착 */
        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: transparent !important;
            margin-bottom: 20px;
            opacity: 0;
            will-change: transform, opacity;
            animation: grail-smooth-impact 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.25s forwards;
        }

        .holy-grail-img {
            width: 180px;
            max-width: 100%;
            height: auto;
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            animation: grail-gentle-float 3s infinite ease-in-out;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
            display: block;
            margin: 0 auto;
        }

        /* 본제목: 매끄러운 확대 감속 퍼짐 연출 */
        .main-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 9px;
            margin-bottom: 12px;
            color: #f5f0e6;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 35px rgba(255, 50, 50, 0.7);
            text-transform: uppercase;
            opacity: 0;
            will-change: letter-spacing, opacity;
            animation: title-smooth-expand 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.45s forwards;
        }

        /* 소제목 */
        .sub-title {
            font-size: 1.15rem;
            font-weight: 400;
            color: #b5b5c2;
            letter-spacing: 1px;
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
            padding: 0 15px;
            opacity: 0;
            animation: fade-in 0.8s ease-out 1.75s forwards;
        }

        /* 화면 우측 하단 워터마크 */
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 25px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1.5px;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            animation: fade-in 1.2s ease-out 2.0s forwards;
        }

        /* --- 60fps 부드러운 애니메이션 정의 --- */

        /* 비네트가 테두리부터 붉게 압축되다 폭발과 함께 소멸 */
        @keyframes vignette-pulse-charge {
            0% {
                opacity: 0;
                box-shadow: inset 0 0 50px rgba(180, 0, 20, 0);
            }
            80% {
                opacity: 1;
                box-shadow: inset 0 0 200px rgba(220, 10, 30, 0.95);
            }
            100% {
                opacity: 0;
            }
        }

        /* 빵! 터지는 딥 레드 섬광 효과 */
        @keyframes impact-flash {
            0% {
                opacity: 1;
            }
            40% {
                opacity: 0.8;
            }
            100% {
                opacity: 0;
            }
        }

        /* 성배의 묵직하고 매끄러운 안착 모션 */
        @keyframes grail-smooth-impact {
            0% {
                opacity: 0;
                transform: scale(1.35);
                filter: drop-shadow(0 0 50px rgba(255, 255, 255, 1));
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
            }
        }

        /* 본제목 자간이 부드럽게 펼쳐지며 안착 */
        @keyframes title-smooth-expand {
            0% {
                opacity: 0;
                letter-spacing: 2px;
            }
            100% {
                opacity: 1;
                letter-spacing: 9px;
            }
        }

        /* 카메라 임팩트 셰이크 */
        @keyframes camera-impact {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 6px); }
            40% { transform: translate(8px, -8px); }
            60% { transform: translate(-5px, 4px); }
            80% { transform: translate(3px, -2px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes grail-gentle-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes pulse-aura {
            0% { opacity: 0.4; transform: scale(0.98); }
            100% { opacity: 0.8; transform: scale(1.02); }
        }

        @keyframes dust-fade {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 배경 마력 이펙트 레이어 -->
    <div class="background-aura"></div>

    <!-- 화면 아래쪽 붉은 먼지/안개 이펙트 레이어 -->
    <div class="red-dust-effect"></div>

    <!-- 비네트 붉은 충전 및 폭발 섬광 레이어 -->
    <div class="vignette-red-charge"></div>
    <div class="impact-flash-overlay"></div>

    <!-- 컨텐츠 레이어 -->
    <main class="content-container">
        <!-- 1. 성배 이미지 -->
        <div class="holy-grail-wrapper">
            <img src="holygrail.png" alt="Holy Grail" class="holy-grail-img">
        </div>

        <!-- 2. 본제목 -->
        <h1 class="main-title">성배전쟁</h1>

        <!-- 3. 소제목 -->
        <p class="sub-title">온갖 시대, 온갖 나라의 영웅이 현대에 되살아나 힘을 겨루는 살육전</p>
    </main>

    <!-- 화면 우측 하단 워터마크 -->
    <footer class="watermark">Made by 사과사과</footer>

    <script>
        // 비네트 충전 후 폭발 시점(1.1초)에 맞춰 정밀 카메라 셰이크 동기화
        setTimeout(() => {
            document.body.classList.add('shake-active');
        }, 1100);
    </script>
</body>
</html>
