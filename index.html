<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate/series</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-color: #000000;
        }

        /* 메인 배경 이미지 */
        .main-background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('first-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
        }

        .main-background-layer.active {
            opacity: 1;
        }

        /* 화면 아래 붉은 먼지/안개 이펙트 */
        .red-dust-effect {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(to top, rgba(140, 10, 10, 0.35) 0%, rgba(70, 0, 0, 0.15) 50%, transparent 100%);
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            transition: opacity 1.8s ease-in-out;
        }

        .red-dust-effect.active {
            opacity: 0.55;
            animation: dust-fade-soft 5s infinite alternate ease-in-out 1.8s;
        }

        /* --- 신규개념 획득 알림 모션 --- */
        #acquireToastContainer {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: none;
            width: 100%;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 10px;
        }

        .word-toast-item {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            opacity: 0;
            animation: float-fade-smooth 1.8s forwards linear;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 5px rgba(255, 215, 0, 0.6);
            user-select: none;
            white-space: nowrap;
            will-change: transform, opacity;
        }

        @keyframes float-fade-smooth {
            0% {
                transform: translateY(35px);
                opacity: 0;
            }
            50% {
                transform: translateY(0px);
                opacity: 1;
            }
            100% {
                transform: translateY(-35px);
                opacity: 0;
            }
        }

        /* --- 신규개념 (노란색 하이라이트 키워드) 전용 스타일 --- */
        .interactive-keyword {
            color: #ffd700 !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
            transition: color 0.3s ease, text-shadow 0.3s ease;
            user-select: none;
            display: inline-block;
            position: relative;
            z-index: 10;
        }

        .interactive-keyword:hover {
            color: #ffffff !important;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
        }

        .interactive-keyword.clicked {
            color: #d0c5b5 !important;
            font-weight: 400 !important;
            cursor: default !important;
            text-shadow: none !important;
            pointer-events: none !important;
        }

        /* --- 어록 속성 --- */
        .description-quote {
            font-style: italic;
            color: rgba(235, 225, 210, 0.9);
            display: inline-block;
            cursor: pointer !important;
            user-select: none;
            animation: quote-gentle-glow 2.5s infinite alternate ease-in-out;
            transition: color 0.3s ease, transform 0.2s ease, text-shadow 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .description-quote:hover {
            color: #ffffff !important;
            transform: scale(1.02);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 255, 255, 0.6) !important;
        }

        .description-quote.glow-fade-out {
            animation: none !important;
            text-shadow: none !important;
        }

        @keyframes quote-gentle-glow {
            0% {
                text-shadow: 0 0 4px rgba(255, 255, 255, 0.3);
            }
            100% {
                text-shadow: 0 0 14px rgba(255, 255, 255, 0.8), 0 0 22px rgba(255, 255, 255, 0.5);
            }
        }

        /* --- 0. 최초 접속 화면 우측 하단 전체화면 안내 문구 --- */
        .initial-notice-right {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 50;
            font-size: 0.95rem;
            color: rgba(215, 205, 190, 0.7);
            letter-spacing: 1.5px;
            user-select: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 5px rgba(100, 0, 0, 0.8);
            transition: opacity 0.6s ease-out;
            pointer-events: none;
        }

        .initial-notice-right.hide {
            opacity: 0;
        }

        /* --- 1. [시작하기] UI 버튼 --- */
        .start-btn-container {
            position: absolute;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            transform: translateX(2px);
        }

        .fate-start-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #f5f0e6;
            background: rgba(20, 0, 0, 0.85);
            border: 2px solid #900000;
            padding: 16px 48px;
            letter-spacing: 6px;
            margin-right: -6px;
            cursor: pointer;
            outline: none;
            position: relative;
            box-shadow: 0 0 15px rgba(140, 0, 0, 0.6), inset 0 0 10px rgba(100, 0, 0, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .fate-start-btn:hover {
            color: #ffffff;
            background: rgba(60, 0, 0, 0.95);
            border-color: #ff2222;
            box-shadow: 0 0 25px rgba(255, 30, 30, 0.9), inset 0 0 15px rgba(180, 0, 0, 0.8);
            transform: scale(1.05);
        }

        .start-btn-container.hide {
            opacity: 0;
            transform: translateX(2px) scale(0.9);
            pointer-events: none;
        }

        /* --- 2. 타이틀 컨텐츠 컨테이너 --- */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
            background: transparent;
            margin: 0 auto;
            pointer-events: none;
            transform: translateY(-10px);
        }

        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background: transparent !important;
            margin-bottom: 25px;
            opacity: 0;
        }

        .holy-grail-wrapper.animate {
            animation: grail-smooth-fadein 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .fate-logo-img {
            width: 270px;
            max-width: 100%;
            height: auto;
            animation: grail-gentle-float 3s infinite ease-in-out;
            filter: drop-shadow(0 0 22px rgba(200, 20, 20, 0.85));
            display: block;
            margin: 0 auto;
        }

        .sub-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1.5px;
            transform: translateX(2px);
            line-height: 1.6;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 2px 10px rgba(0, 0, 0, 1);
            padding: 0 15px;
            margin-bottom: 35px;
            opacity: 0;
        }

        .sub-title.animate {
            animation: fade-in 1.0s ease-out forwards;
        }

        .extended-dash {
            letter-spacing: 4px;
            margin: 0 2px;
        }

        .press-start-wrapper {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-out;
            transform: translateX(2px);
            position: relative;
        }

        .press-start-wrapper.animate {
            opacity: 1;
            pointer-events: auto;
        }

        .press-start-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #a0a0aa;
            letter-spacing: 5px;
            margin-right: -5px;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 0 5px rgba(100, 100, 110, 0.5);
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease, text-shadow 0.3s ease, transform 0.2s ease;
            animation: slow-blink-loop 2.8s infinite alternate ease-in-out;
        }

        .press-start-btn:hover {
            animation-play-state: paused !important;
            opacity: 1 !important;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 8px rgba(255, 255, 255, 0.9);
            transform: scale(1.08);
        }

        .press-start-wrapper.flash-exit {
            animation: simple-flash-fade 0.25s ease-out forwards !important;
            pointer-events: none !important;
        }

        .slow-fade-out {
            animation: pure-fade-out 1.2s ease-out forwards !important;
            pointer-events: none !important;
        }

        /* --- 3. 메인 화면 좌측 하단 유입자 안내 문구 --- */
        .intro-notice-left {
            position: absolute;
            bottom: 25px;
            left: 25px;
            z-index: 20;
            max-width: 500px;
            font-size: 1.05rem;
            color: rgba(230, 220, 205, 0.65);
            letter-spacing: 1px;
            line-height: 1.45;
            user-select: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 5px rgba(100, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            word-break: keep-all;
        }

        .intro-notice-left.animate {
            animation: fade-in 1.2s ease-out forwards;
        }

        .intro-notice-left.slow-fade-out {
            animation: pure-fade-out 1.2s ease-out forwards !important;
        }

        /* --- 4. Stage 2: 중앙 클릭 가능 인터랙션 탭 --- */
        .center-tab-group-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-out;
        }

        .center-tab-group-container.show {
            opacity: 1;
            pointer-events: auto !important;
        }

        .tab-item-wrapper {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            pointer-events: auto !important;
            transition: top 1.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        left 1.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.8s ease-in-out, 
                        filter 1.4s ease-in-out;
            will-change: top, left, transform, opacity;
        }

        #tabWrapper_grail {
            top: 45%;
        }

        #tabWrapper_sung {
            top: 57%;
        }

        .center-grail-btn {
            font-family: 'Song Myung', serif;
            font-size: 4.5rem;
            font-weight: 700;
            color: #fffdfa;
            letter-spacing: 12px;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer !important;
            user-select: none;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 40px rgba(255, 215, 0, 0.8);
            transition: transform 0.3s ease, color 0.3s ease, text-shadow 0.3s ease;
            display: inline-block;
            pointer-events: auto !important;
        }

        .center-grail-btn:hover {
            color: #ffffff;
            transform: scale(1.08);
            text-shadow: 0 0 50px rgba(255, 230, 100, 1), 0 0 20px rgba(255, 255, 255, 0.9);
        }

        .tab-item-wrapper.move-top-left {
            top: 7% !important;
            left: 6% !important;
            transform: translate(0, 0) scale(0.75) !important;
            filter: brightness(1.3) drop-shadow(0 0 15px rgba(255, 220, 120, 0.9));
            pointer-events: none !important;
            z-index: 35;
        }

        .tab-item-wrapper.fade-out-stay {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* --- 5. 상세 페이지 (Stage 3) --- */
        .grail-detail-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 35;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-left: 18%;
            gap: 16%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
        }

        .grail-detail-view.show {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .detail-grail-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .detail-grail-img {
            width: 280px;
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.7));
            animation: grail-gentle-float 3.5s infinite ease-in-out;
        }

        .grail-sub-label {
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 400;
            color: rgba(215, 205, 190, 0.65);
            letter-spacing: 2px;
            user-select: none;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 4px rgba(100, 0, 0, 0.5);
        }

        .detail-description-right {
            flex: 1;
            max-width: 650px;
            background: rgba(15, 0, 0, 0.75);
            border: 2px solid rgba(160, 0, 0, 0.8);
            border-radius: 8px;
            padding: 40px 35px;
            box-shadow: 0 0 25px rgba(100, 0, 0, 0.7), inset 0 0 15px rgba(80, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            min-height: 250px;
            pointer-events: auto;
            position: relative;
            z-index: 40;
        }

        .description-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f5f0e6;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(180, 0, 0, 0.6);
            padding-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 50, 50, 0.6);
        }

        .description-content {
            font-size: 1.43rem;
            line-height: 1.85;
            color: #d0c5b5;
            letter-spacing: 1px;
            word-break: keep-all;
            pointer-events: auto;
        }

        .description-quote-author {
            font-style: normal;
            font-size: 1.15rem;
            color: #a08a75;
            display: block;
            margin-top: 4px;
            margin-bottom: 16px;
            text-align: right;
            user-select: none;
        }

        /* --- 6. 화면 좌측 하단 뒤로가기 버튼 --- */
        .bottom-left-controls {
            position: absolute;
            bottom: 20px;
            left: 25px;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
        }

        .bottom-left-controls.show {
            opacity: 1;
            pointer-events: auto;
        }

        .fate-back-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.0rem;
            font-weight: 700;
            color: #c0c0c8;
            background: rgba(20, 0, 0, 0.6);
            border: 1px solid rgba(160, 0, 0, 0.7);
            padding: 8px 24px;
            letter-spacing: 2px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 10px rgba(100, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .fate-back-btn:hover {
            color: #ffffff;
            background: rgba(50, 0, 0, 0.8);
            border-color: #ff4444;
            box-shadow: 0 0 18px rgba(255, 50, 50, 0.7);
            transform: scale(1.03);
        }

        /* --- 7. 화면 우측 하단 컨트롤러 --- */
        .bottom-right-controls {
            position: absolute;
            bottom: 20px;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
        }

        .bottom-right-controls.animate {
            pointer-events: auto;
            animation: fade-in 1.2s ease-out forwards;
        }

        .sound-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(15, 0, 0, 0.7);
            border: 1px solid rgba(140, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(80, 0, 0, 0.6);
            backdrop-filter: blur(3px);
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .volume-label {
            font-size: 0.75rem;
            color: #d0c5b5;
            letter-spacing: 1px;
            font-weight: 700;
            user-select: none;
            min-width: 40px;
            text-align: left;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(80, 10, 10, 0.8);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff3333;
            border: 1px solid #ffffff;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
            background: #ff6666;
        }

        .watermark {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1.5px;
            user-select: none;
            margin-top: 2px;
        }

        /* --- 키프레임 애니메이션 정의 --- */

        @keyframes pure-fade-out {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes simple-flash-fade {
            0% { opacity: 1; filter: brightness(1); color: #ffffff; }
            30% { opacity: 1; filter: brightness(5) drop-shadow(0 0 20px #ffffff); color: #ffffff; }
            100% { opacity: 0; filter: brightness(8); color: #ffffff; transform: translateX(2px) scale(0.95); }
        }

        @keyframes slow-blink-loop {
            0% { opacity: 0.2; }
            50% { opacity: 0.85; }
            100% { opacity: 0.2; }
        }

        @keyframes grail-smooth-fadein {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes grail-gentle-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes dust-fade-soft {
            0% { opacity: 0.5; }
            100% { opacity: 0.75; }
        }

        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 신규개념 획득 토스트 알림 컨테이너 -->
    <div id="acquireToastContainer"></div>

    <!-- BGM & SFX 레이어 -->
    <audio id="bgm" src="main-theme.mp3" loop preload="auto"></audio>
    <audio id="pstSfx" src="sfx/sfx-pst.mp3" preload="auto"></audio>
    <audio id="wordSfx" src="sfx/sfx-word.mp3" preload="auto"></audio>
    <audio id="noshinSfx" src="sfx/sfx-noshin.mp3" preload="auto"></audio>
    <audio id="kotomineSfx" src="voice/holygrail-kotomine.mp3" preload="auto"></audio>

    <!-- 메인 배경 & 안개 -->
    <div class="main-background-layer" id="bgLayer"></div>
    <div class="red-dust-effect" id="dustEffect"></div>

    <!-- 0단계: 최초 접속 화면 우측 하단 전체화면 안내 문구 구역 -->
    <div class="initial-notice-right" id="initialNotice">
        ※이 사이트는 컴퓨터 전체화면을 기준으로 제작되었습니다.
    </div>

    <!-- 1단계: [시작하기] UI 버튼 -->
    <div class="start-btn-container" id="btnContainer">
        <button class="fate-start-btn" id="startBtn">시작하기</button>
    </div>

    <!-- 1단계 메인 타이틀 컨텐츠 -->
    <main class="content-container">
        <div class="holy-grail-wrapper" id="grailWrapper">
            <img src="Fate.png" alt="Fate Logo" class="fate-logo-img">
        </div>

        <p class="sub-title" id="subTitle">성배와 영령<span class="extended-dash">—</span>그리고 운명의 이야기</p>

        <div class="press-start-wrapper" id="pressStartWrapper">
            <button class="press-start-btn" id="pressStartBtn">- PRESS TO START -</button>
        </div>
    </main>

    <!-- 메인 화면 좌측 하단 유입자 안내 문구 구역 -->
    <div class="intro-notice-left" id="introNotice">
        ※유입자를 위해 만들어진 사이트이니 생략되거나 스포일러 때문에 진실과는 다르게 설명한 것들이 있을 수 있습니다.
    </div>

    <!-- 2단계: 중앙 인터랙션 탭 그룹 -->
    <div class="center-tab-group-container" id="centerTabGroup">
        <!-- 기본 성배 탭 (sungbae 고유번호 소지) -->
        <div class="tab-item-wrapper" id="tabWrapper_grail">
            <button class="center-grail-btn" id="tabBtn_grail">성배</button>
        </div>
        <!-- sung 고유번호 획득 시 동적으로 연동되는 성배전쟁 탭 -->
        <div class="tab-item-wrapper" id="tabWrapper_sung" style="display: none;">
            <button class="center-grail-btn" id="tabBtn_sung">성배전쟁</button>
        </div>
    </div>

    <!-- 3단계: 성배 상세 페이지 -->
    <section class="grail-detail-view" id="detailView_grail">
        <div class="detail-grail-left">
            <img src="holygrail.png" alt="Holy Grail Detail" class="detail-grail-img">
            <span class="grail-sub-label">소(小)성배</span>
        </div>
        <div class="detail-description-right">
            <h2 class="description-title">성배란?</h2>
            <div class="description-content">
                <!-- 어록 속성 영역 -->
                <span class="description-quote" id="kotomineTrigger">"성배란, 어떤 소원이라도 이루어주는 원망기다."</span>
                <span class="description-quote-author">- 코토미네 키레이</span>

                <!-- sung 고유번호를 부여받은 신규개념 성배전쟁 -->
                <p style="margin-top: 12px;">성배란 <span class="interactive-keyword" data-key="sung">성배전쟁</span>이 일어나기 위한 촉매이다.</p>
            </div>
        </div>
    </section>

    <!-- 3단계: 성배전쟁 상세 고유 페이지 (공간 비워둠) -->
    <section class="grail-detail-view" id="detailView_sung">
        <div class="detail-grail-left" id="sungDetailLeft">
            <!-- 비워둠 -->
        </div>
        <div class="detail-description-right" id="sungDetailRight">
            <h2 class="description-title" id="sungDetailTitle"></h2>
            <div class="description-content" id="sungDetailContent">
                <!-- 비워둠 -->
            </div>
        </div>
    </section>

    <!-- 화면 좌측 하단 (화살표)뒤로가기 버튼 -->
    <div class="bottom-left-controls" id="backBtnWrapper">
        <button class="fate-back-btn" id="backBtn">⇦ 뒤로가기</button>
    </div>

    <!-- 화면 우측 하단 컨트롤러 -->
    <div class="bottom-right-controls" id="controlsGroup">
        <div class="sound-panel">
            <div class="volume-control-box">
                <span class="volume-label">SFX</span>
                <input type="range" id="seSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.1">
            </div>
            <div class="volume-control-box">
                <span class="volume-label">BGM</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.1">
            </div>
            <div class="volume-control-box">
                <span class="volume-label">VOICE</span>
                <input type="range" id="voiceSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.3">
            </div>
        </div>
        <footer class="watermark">Made by 사과사과</footer>
    </div>

    <script>
        // 모바일 데스크톱 모드 및 PC 새로고침 시 세션 초기화
        (function checkReloadAndReset() {
            const navEntries = performance.getEntriesByType('navigation');
            const isReload = (navEntries.length > 0 && navEntries[0].type === 'reload') || 
                             (performance.navigation && performance.navigation.type === 1);
            
            if (isReload) {
                const keysToRemove = ['sung', 'sungbae'];
                keysToRemove.forEach(k => sessionStorage.removeItem('fate_kw_clicked_' + k));
            }
        })();

        document.addEventListener('DOMContentLoaded', function() {
            // 접속 시 성배(sungbae) 고유번호 기본 소지 설정 (알림 없이 세션 등록)
            sessionStorage.setItem('fate_kw_clicked_sungbae', 'true');

            const bgm = document.getElementById('bgm');
            const pstSfx = document.getElementById('pstSfx');
            const wordSfx = document.getElementById('wordSfx');
            const noshinSfx = document.getElementById('noshinSfx');
            const kotomineSfx = document.getElementById('kotomineSfx');

            const volumeSlider = document.getElementById('volumeSlider');
            const seSlider = document.getElementById('seSlider');
            const voiceSlider = document.getElementById('voiceSlider');

            const startBtn = document.getElementById('startBtn');
            const pressStartBtn = document.getElementById('pressStartBtn');
            const backBtn = document.getElementById('backBtn');
            const kotomineTrigger = document.getElementById('kotomineTrigger');
            const acquireToastContainer = document.getElementById('acquireToastContainer');

            const initialNotice = document.getElementById('initialNotice');
            const grailWrapper = document.getElementById('grailWrapper');
            const subTitle = document.getElementById('subTitle');
            const pressStartWrapper = document.getElementById('pressStartWrapper');
            const introNotice = document.getElementById('introNotice');

            const centerTabGroup = document.getElementById('centerTabGroup');
            const backBtnWrapper = document.getElementById('backBtnWrapper');

            const tabWrappers = {
                grail: document.getElementById('tabWrapper_grail'),
                sung: document.getElementById('tabWrapper_sung')
            };

            const tabBtns = {
                grail: document.getElementById('tabBtn_grail'),
                sung: document.getElementById('tabBtn_sung')
            };

            const detailViews = {
                grail: document.getElementById('detailView_grail'),
                sung: document.getElementById('detailView_sung')
            };

            let currentStage = 1;
            let currentActiveTabKey = null;
            let activeToastCount = 0;

            // 볼륨 연동
            volumeSlider.addEventListener('input', function() {
                if (bgm) bgm.volume = parseFloat(this.value);
            });

            seSlider.addEventListener('input', function() {
                if (pstSfx) pstSfx.volume = parseFloat(this.value);
                if (wordSfx) wordSfx.volume = Math.min(1, parseFloat(this.value) * 1.3);
                if (noshinSfx) noshinSfx.volume = parseFloat(this.value);
            });

            voiceSlider.addEventListener('input', function() {
                if (kotomineSfx) kotomineSfx.volume = parseFloat(this.value);
            });

            seSlider.addEventListener('change', function() {
                if (pstSfx) {
                    pstSfx.currentTime = 0;
                    pstSfx.play().catch(e => console.log(e));
                }
            });

            // 코토미네 보이스 시간제한
            if (kotomineSfx) {
                kotomineSfx.addEventListener('timeupdate', function() {
                    if (this.currentTime >= 4.4) {
                        this.pause();
                        this.currentTime = 0;
                    }
                });
            }

            // 어록 클릭 이벤트
            if (kotomineTrigger) {
                kotomineTrigger.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (!this.classList.contains('glow-fade-out')) {
                        this.classList.add('glow-fade-out');
                    }

                    if (kotomineSfx) {
                        kotomineSfx.volume = parseFloat(voiceSlider.value);
                        kotomineSfx.currentTime = 0;
                        kotomineSfx.play().catch(e => console.log("보이스 재생 예외:", e));
                    }
                });
            }

            // 토스트 생성
            function spawnAcquireToast(wordText) {
                activeToastCount++;
                const toastEl = document.createElement('div');
                toastEl.className = 'word-toast-item';
                toastEl.innerText = `—${wordText}을(를) 획득했습니다—`;

                acquireToastContainer.appendChild(toastEl);

                setTimeout(() => {
                    if (toastEl && toastEl.parentNode) {
                        toastEl.parentNode.removeChild(toastEl);
                    }
                    activeToastCount = Math.max(0, activeToastCount - 1);
                }, 1800);
            }

            // 신규개념 키워드 이벤트
            const keywords = document.querySelectorAll('.interactive-keyword');
            
            keywords.forEach(el => {
                const key = el.getAttribute('data-key');
                const sessionKey = 'fate_kw_clicked_' + key;
                
                if (sessionStorage.getItem(sessionKey) === 'true') {
                    el.classList.add('clicked');
                } else {
                    el.classList.remove('clicked');
                }

                el.addEventListener('click', function(e) {
                    e.stopPropagation();

                    if (activeToastCount > 0) {
                        if (noshinSfx) {
                            noshinSfx.volume = parseFloat(seSlider.value);
                            noshinSfx.currentTime = 0;
                            noshinSfx.play().catch(err => console.log(err));
                        }
                        return;
                    }

                    if (!this.classList.contains('clicked')) {
                        this.classList.add('clicked');
                        sessionStorage.setItem(sessionKey, 'true');

                        if (wordSfx) {
                            wordSfx.volume = Math.min(1, parseFloat(seSlider.value) * 1.3);
                            wordSfx.currentTime = 0;
                            wordSfx.play().catch(err => console.log(err));
                        }

                        spawnAcquireToast(this.innerText.trim());
                    }
                });
            });

            function refreshDynamicTabs() {
                const hasSung = sessionStorage.getItem('fate_kw_clicked_sung') === 'true';
                
                if (hasSung) {
                    tabWrappers.sung.style.display = 'block';
                    tabWrappers.grail.style.top = '40%';
                    tabWrappers.sung.style.top = '54%';
                } else {
                    tabWrappers.sung.style.display = 'none';
                    tabWrappers.grail.style.top = '48%';
                }
            }

            // 탭 클릭 및 고유 페이지(Stage 3) 진입 공통 함수
            function openTabDetail(selectedKey, event) {
                if (event) event.stopPropagation();

                if (pstSfx) {
                    pstSfx.currentTime = 0;
                    pstSfx.play().catch(e => console.log(e));
                }

                currentActiveTabKey = selectedKey;

                Object.keys(tabWrappers).forEach(k => {
                    const wrap = tabWrappers[k];
                    if (k === selectedKey) {
                        wrap.classList.add('move-top-left');
                    } else {
                        wrap.classList.add('fade-out-stay');
                    }
                });

                setTimeout(() => {
                    if (detailViews[selectedKey]) {
                        detailViews[selectedKey].classList.add('show');
                    }
                    currentStage = 3;
                }, 1100);
            }

            // 탭 버튼 클릭 이벤트 바인딩 보완
            if (tabBtns.grail) {
                tabBtns.grail.addEventListener('click', (e) => openTabDetail('grail', e));
            }
            if (tabBtns.sung) {
                tabBtns.sung.addEventListener('click', (e) => openTabDetail('sung', e));
            }

            pressStartBtn.addEventListener('click', function() {
                if (pstSfx) {
                    pstSfx.volume = parseFloat(seSlider.value);
                    pstSfx.currentTime = 0;
                    pstSfx.play().catch(e => console.log(e));
                }

                pressStartWrapper.classList.add('flash-exit');

                setTimeout(() => {
                    grailWrapper.classList.add('slow-fade-out');
                    subTitle.classList.add('slow-fade-out');
                    introNotice.classList.add('slow-fade-out');
                }, 250);

                setTimeout(() => {
                    refreshDynamicTabs();
                    centerTabGroup.classList.add('show');
                    backBtnWrapper.classList.add('show');
                    currentStage = 2;
                }, 1450);
            });

            backBtn.addEventListener('click', function() {
                if (pstSfx) {
                    pstSfx.currentTime = 0;
                    pstSfx.play().catch(e => console.log(e));
                }

                if (kotomineSfx) {
                    kotomineSfx.pause();
                    kotomineSfx.currentTime = 0;
                }

                if (currentStage === 3) {
                    if (currentActiveTabKey && detailViews[currentActiveTabKey]) {
                        detailViews[currentActiveTabKey].classList.remove('show');
                    }

                    setTimeout(() => {
                        Object.keys(tabWrappers).forEach(k => {
                            tabWrappers[k].classList.remove('move-top-left');
                            tabWrappers[k].classList.remove('fade-out-stay');
                        });
                        refreshDynamicTabs();
                        currentStage = 2;
                        currentActiveTabKey = null;
                    }, 400);

                } else if (currentStage === 2) {
                    centerTabGroup.classList.remove('show');
                    backBtnWrapper.classList.remove('show');

                    setTimeout(() => {
                        grailWrapper.classList.remove('slow-fade-out');
                        subTitle.classList.remove('slow-fade-out');
                        introNotice.classList.remove('slow-fade-out');
                    }, 300);

                    setTimeout(() => {
                        pressStartWrapper.classList.remove('flash-exit');
                        pressStartWrapper.style.opacity = '0';
                        void pressStartWrapper.offsetWidth;
                        pressStartWrapper.style.opacity = '1';
                        pressStartWrapper.style.pointerEvents = 'auto';
                        currentStage = 1;
                    }, 800);
                }
            });

            startBtn.addEventListener('click', function() {
                const btnContainer = document.getElementById('btnContainer');
                const bgLayer = document.getElementById('bgLayer');
                const dustEffect = document.getElementById('dustEffect');
                const controlsGroup = document.getElementById('controlsGroup');

                btnContainer.classList.add('hide');
                initialNotice.classList.add('hide');

                if (bgm) {
                    bgm.volume = parseFloat(volumeSlider.value);
                    setTimeout(() => {
                        bgm.play().catch(e => console.log(e));
                    }, 700);
                }

                if (pstSfx) pstSfx.volume = parseFloat(seSlider.value);
                if (wordSfx) wordSfx.volume = Math.min(1, parseFloat(seSlider.value) * 1.3);
                if (noshinSfx) noshinSfx.volume = parseFloat(seSlider.value);
                if (kotomineSfx) kotomineSfx.volume = parseFloat(voiceSlider.value);

                setTimeout(() => bgLayer.classList.add('active'), 300);
                setTimeout(() => dustEffect.classList.add('active'), 500);
                setTimeout(() => grailWrapper.classList.add('animate'), 1400);

                setTimeout(() => {
                    subTitle.classList.add('animate');
                    introNotice.classList.add('animate');
                    controlsGroup.classList.add('animate');
                }, 2200);

                setTimeout(() => pressStartWrapper.classList.add('animate'), 3000);
            });
        });
    </script>
</body>
</html>
