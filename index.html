<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성배전쟁 - Fate/stay night 테마</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-image: url('first-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
        }

        /* 배경 마력 오라 레이어 */
        .background-aura {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(80, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.6) 80%);
            z-index: 1;
            animation: pulse-aura 4s infinite alternate ease-in-out;
            pointer-events: none;
        }

        /* 화면 아래 붉은 먼지 안개 */
        .red-dust-effect {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(to top, rgba(140, 10, 10, 0.45) 0%, rgba(80, 0, 0, 0.2) 50%, transparent 100%);
            z-index: 2;
            pointer-events: none;
            animation: dust-fade 6s infinite alternate ease-in-out;
        }

        /* --- 외각 테두리부터 중심부까지 퍼지는 붉은 이펙트 --- */

        .vignette-inward-spread {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 22;
            pointer-events: none;
            opacity: 0;
            will-change: opacity, background;
            /* 테두리에서 중심으로 붉은 마력이 퍼져나가는 애니메이션 */
            animation: red-spread-center 1.1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* --- 순백 덮침 & 빠른 페이드아웃 오버레이 (복구 및 상위 z-index 지정) --- */

        .white-flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff !important;
            z-index: 999; /* 최상단 레이어 보장 */
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            /* 붉은 마력이 중심으로 모여든 후(0.9s) 순백으로 화면을 가렸다가 싹 사라짐 */
            animation: white-cover-fast-fade 0.45s ease-out 0.9s forwards;
        }

        /* 컨텐츠 컨테이너 */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
            background: transparent;
            margin: 0 auto;
        }

        /* 성배 이미지: 순백 오버레이로 완전히 가려지는 시점(1.0s)에 딜레이 없이 설치 */
        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: transparent !important;
            margin-bottom: 20px;
            opacity: 0;
            will-change: opacity;
            animation: instant-appear 0.01s linear 1.0s forwards;
        }

        .holy-grail-img {
            width: 180px;
            max-width: 100%;
            height: auto;
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            animation: grail-gentle-float 3s infinite ease-in-out;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
            display: block;
            margin: 0 auto;
        }

        /* 본제목: 페이드아웃이 진행되는 시점(1.25s)에 순차 등장 */
        .main-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 9px;
            margin-bottom: 12px;
            color: #f5f0e6;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 35px rgba(255, 50, 50, 0.7);
            text-transform: uppercase;
            opacity: 0;
            will-change: opacity;
            animation: fade-in 0.4s ease-out 1.25s forwards;
        }

        /* 소제목 */
        .sub-title {
            font-size: 1.15rem;
            font-weight: 400;
            color: #b5b5c2;
            letter-spacing: 1px;
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
            padding: 0 15px;
            opacity: 0;
            animation: fade-in 0.6s ease-out 1.45s forwards;
        }

        /* 화면 우측 하단 워터마크 */
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 25px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1.5px;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            animation: fade-in 0.8s ease-out 1.65s forwards;
        }

        /* --- 키프레임 애니메이션 정의 --- */

        /* 테두리 외각에서 시작되어 화면 정중앙 바로 앞까지 붉게 덮여오는 연출 */
        @keyframes red-spread-center {
            0% {
                opacity: 0;
                background: radial-gradient(circle at 50% 50%, transparent 90%, rgba(255, 10, 30, 0.9) 100%);
            }
            50% {
                opacity: 0.8;
                background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(220, 0, 20, 0.95) 75%, rgba(80, 0, 0, 1) 100%);
            }
            85%, 100% {
                opacity: 1;
                background: radial-gradient(circle at 50% 50%, transparent 10%, rgba(200, 0, 20, 1) 50%, rgba(50, 0, 0, 1) 100%);
            }
        }

        /* 순백의 완전 덮침 및 빠르게 사라지는 연출 */
        @keyframes white-cover-fast-fade {
            0% {
                opacity: 0;
            }
            30% {
                opacity: 1; /* 완전히 순백으로 가림 */
            }
            100% {
                opacity: 0; /* 빠르게 페이드아웃 */
            }
        }

        @keyframes instant-appear {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes grail-gentle-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes pulse-aura {
            0% { opacity: 0.4; transform: scale(0.98); }
            100% { opacity: 0.8; transform: scale(1.02); }
        }

        @keyframes dust-fade {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 배경 마력 이펙트 레이어 -->
    <div class="background-aura"></div>

    <!-- 화면 아래쪽 붉은 먼지/안개 이펙트 레이어 -->
    <div class="red-dust-effect"></div>

    <!-- 테두리에서 중심으로 수축하며 퍼지는 붉은 이펙트 레이어 -->
    <div class="vignette-inward-spread"></div>

    <!-- 최상단 순백 덮침 및 페이드 오버레이 레이어 -->
    <div class="white-flash-overlay"></div>

    <!-- 컨텐츠 레이어 -->
    <main class="content-container">
        <!-- 1. 성배 이미지 -->
        <div class="holy-grail-wrapper">
            <img src="holygrail.png" alt="Holy Grail" class="holy-grail-img">
        </div>

        <!-- 2. 본제목 -->
        <h1 class="main-title">성배전쟁</h1>

        <!-- 3. 소제목 -->
        <p class="sub-title">온갖 시대, 온갖 나라의 영웅이 현대에 되살아나 힘을 겨루는 살육전</p>
    </main>

    <!-- 화면 우측 하단 워터마크 -->
    <footer class="watermark">Made by 사과사과</footer>

</body>
</html>
