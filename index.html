<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성배전쟁 - Fate/stay night 테마</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-image: url('first-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
        }

        /* Sol RNG 스타일 화면 폭발 셰이크 연출용 클래스 */
        body.shake-active {
            animation: camera-shake 0.4s ease-out;
        }

        /* 배경 마력 오라 레이어 */
        .background-aura {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(80, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.6) 80%);
            z-index: 1;
            animation: pulse-aura 4s infinite alternate ease-in-out;
            pointer-events: none;
        }

        /* 화면 아래 붉은 먼지 안개 */
        .red-dust-effect {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(to top, rgba(140, 10, 10, 0.45) 0%, rgba(80, 0, 0, 0.2) 50%, transparent 100%);
            z-index: 2;
            pointer-events: none;
            animation: dust-fade 6s infinite alternate ease-in-out;
        }

        /* --- Sol RNG 컷신 연출 요소 --- */

        /* 1. 슈룩: 빛이 정중앙으로 순식간에 모여드는 응축 이펙트 */
        .sols-gather-point {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #ff1133 60%, transparent 100%);
            z-index: 25;
            pointer-events: none;
            animation: sols-implode 0.7s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        /* 2. 빵!: 중심에서 터지며 전면을 뒤덮는 섬광 컷신 오버레이 */
        .sols-flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            animation: sols-explode 0.6s ease-out 0.7s forwards;
        }

        /* 컨텐츠 컨테이너 */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
            background: transparent;
            margin: 0 auto;
        }

        /* 3. 성배 이미지: 폭발 섬광 직후 '빵!' 하며 등장 */
        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: transparent !important;
            margin-bottom: 20px;
            opacity: 0;
            animation: grail-impact-drop 0.35s cubic-bezier(0.12, 0, 0.39, 0) 0.85s forwards;
        }

        .holy-grail-img {
            width: 180px;
            max-width: 100%;
            height: auto;
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            animation: grail-gentle-float 3s infinite ease-in-out;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
            display: block;
            margin: 0 auto;
        }

        /* 본제목: 성배 안착 후 즉시 좌우 펼쳐짐 안착 */
        .main-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 9px;
            margin-bottom: 12px;
            color: #f5f0e6;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 35px rgba(255, 50, 50, 0.7);
            text-transform: uppercase;
            opacity: 0;
            animation: title-snap-fixed 0.35s cubic-bezier(0.1, 0.9, 0.2, 1) 1.1s forwards;
        }

        /* 소제목 */
        .sub-title {
            font-size: 1.15rem;
            font-weight: 400;
            color: #b5b5c2;
            letter-spacing: 1px;
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
            padding: 0 15px;
            opacity: 0;
            animation: fade-in 0.8s ease-out 1.4s forwards;
        }

        /* 화면 우측 하단 워터마크 */
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 25px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1.5px;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            animation: fade-in 1.2s ease-out 1.7s forwards;
        }

        /* --- Sol RNG 애니메이션 연출 정의 --- */

        /* 슈룩: 정중앙 중심점 수축 이펙트 */
        @keyframes sols-implode {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(4);
                filter: blur(25px);
            }
            70% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.3);
                filter: blur(2px);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.05);
                filter: blur(0px);
            }
        }

        /* 빵!: 화면 뒤덮는 강렬한 섬광 발산 */
        @keyframes sols-explode {
            0% {
                opacity: 1;
                background: #ffffff;
            }
            30% {
                opacity: 0.9;
                background: #ff2244;
            }
            100% {
                opacity: 0;
                background: transparent;
            }
        }

        /* 성배 임팩트 안착 연출 */
        @keyframes grail-impact-drop {
            0% {
                opacity: 0;
                transform: scale(1.6);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 화면 진동 카메라 셰이크 */
        @keyframes camera-shake {
            0% { transform: translate(0, 0); }
            15% { transform: translate(-12px, 8px); }
            30% { transform: translate(10px, -10px); }
            45% { transform: translate(-8px, -6px); }
            60% { transform: translate(6px, 6px); }
            75% { transform: translate(-3px, 2px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes grail-gentle-float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes title-snap-fixed {
            0% {
                opacity: 0;
                letter-spacing: 2px;
            }
            100% {
                opacity: 1;
                letter-spacing: 9px;
            }
        }

        @keyframes pulse-aura {
            0% { opacity: 0.4; transform: scale(0.98); }
            100% { opacity: 0.8; transform: scale(1.02); }
        }

        @keyframes dust-fade {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 배경 마력 이펙트 레이어 -->
    <div class="background-aura"></div>

    <!-- 화면 아래쪽 붉은 먼지/안개 이펙트 레이어 -->
    <div class="red-dust-effect"></div>

    <!-- Sol RNG 특유의 빛 응축 점(슈룩) 및 폭발 오버레이(빵!) -->
    <div class="sols-gather-point"></div>
    <div class="sols-flash-overlay"></div>

    <!-- 컨텐츠 레이어 -->
    <main class="content-container">
        <!-- 1. 성배 이미지 -->
        <div class="holy-grail-wrapper">
            <img src="holygrail.png" alt="Holy Grail" class="holy-grail-img">
        </div>

        <!-- 2. 본제목 -->
        <h1 class="main-title">성배전쟁</h1>

        <!-- 3. 소제목 -->
        <p class="sub-title">온갖 시대, 온갖 나라의 영웅이 현대에 되살아나 힘을 겨루는 살육전</p>
    </main>

    <!-- 화면 우측 하단 워터마크 -->
    <footer class="watermark">Made by 사과사과</footer>

    <script>
        // Sol RNG 폭발 섬광 타이밍(0.7초)에 정확히 맞춰 화면 셰이크 트리거
        setTimeout(() => {
            document.body.classList.add('shake-active');
        }, 700);
    </script>
</body>
</html>
