<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성배전쟁 - Fate/stay night 테마</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-image: url('first-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
        }

        /* 배경 마력 오라 레이어 */
        .background-aura {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(80, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.6) 80%);
            z-index: 1;
            animation: pulse-aura 4s infinite alternate ease-in-out;
            pointer-events: none;
        }

        /* 화면 아래 붉은 먼지 안개 */
        .red-dust-effect {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(to top, rgba(140, 10, 10, 0.45) 0%, rgba(80, 0, 0, 0.2) 50%, transparent 100%);
            z-index: 2;
            pointer-events: none;
            animation: dust-fade 6s infinite alternate ease-in-out;
        }

        /* --- 초고농도 깊은 비네트 연출 --- */

        /* 비네트 범위를 중심부 바로 앞까지 획기적으로 깊게 확장 */
        .vignette-deep-charge {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 600px rgba(220, 0, 20, 1), inset 0 0 250px rgba(60, 0, 0, 1);
            z-index: 22;
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            animation: vignette-ultra-deep 1.0s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* 순백의 완전 덮침 후 훨씬 빠르고 기민한 페이드아웃 */
        .white-flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            /* 빠른 속도로 덮었다가 싹 사라지는 페이드아웃 */
            animation: white-cover-fast-fade 0.4s ease-out 1.0s forwards;
        }

        /* 컨텐츠 컨테이너 */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
            background: transparent;
            margin: 0 auto;
        }

        /* 성배 이미지 래퍼 (하얀 장막 속에서 딜레이 없이 즉시 설치되도록 복구) */
        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: transparent !important;
            margin-bottom: 20px;
            opacity: 0;
            will-change: opacity;
            animation: instant-appear 0.01s linear 1.1s forwards;
        }

        .holy-grail-img {
            width: 180px;
            max-width: 100%;
            height: auto;
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            animation: grail-gentle-float 3s infinite ease-in-out;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
            display: block;
            margin: 0 auto;
        }

        /* 본제목 (페이드 아웃 직후 등장) */
        .main-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 9px;
            margin-bottom: 12px;
            color: #f5f0e6;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 35px rgba(255, 50, 50, 0.7);
            text-transform: uppercase;
            opacity: 0;
            will-change: opacity;
            animation: fade-in 0.4s ease-out 1.35s forwards;
        }

        /* 소제목 */
        .sub-title {
            font-size: 1.15rem;
            font-weight: 400;
            color: #b5b5c2;
            letter-spacing: 1px;
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
            padding: 0 15px;
            opacity: 0;
            animation: fade-in 0.6s ease-out 1.55s forwards;
        }

        /* 화면 우측 하단 워터마크 */
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 25px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1.5px;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            animation: fade-in 0.8s ease-out 1.75s forwards;
        }

        /* --- 동적 애니메이션 정의 --- */

        /* 화면을 매우 깊숙하게 침식하는 비네트 연출 */
        @keyframes vignette-ultra-deep {
            0% {
                opacity: 0;
                box-shadow: inset 0 0 100px rgba(220, 0, 20, 0);
            }
            85% {
                opacity: 1;
                box-shadow: inset 0 0 700px rgba(255, 10, 30, 1);
            }
            100% {
                opacity: 0;
            }
        }

        /* 순백 덮침 후 한층 빠르고 슬림해진 페이드아웃 */
        @keyframes white-cover-fast-fade {
            0% {
                opacity: 0;
            }
            25% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        /* 성배 이미지 즉시 출력 고정 */
        @keyframes instant-appear {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes grail-gentle-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes pulse-aura {
            0% { opacity: 0.4; transform: scale(0.98); }
            100% { opacity: 0.8; transform: scale(1.02); }
        }

        @keyframes dust-fade {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 배경 마력 이펙트 레이어 -->
    <div class="background-aura"></div>

    <!-- 화면 아래쪽 붉은 먼지/안개 이펙트 레이어 -->
    <div class="red-dust-effect"></div>

    <!-- 초고농도 극대화 비네트 충전 및 하얀 페이드 오버레이 레이어 -->
    <div class="vignette-deep-charge"></div>
    <div class="white-flash-overlay"></div>

    <!-- 컨텐츠 레이어 -->
    <main class="content-container">
        <!-- 1. 성배 이미지 (정상 출력 복구) -->
        <div class="holy-grail-wrapper">
            <img src="holygrail.png" alt="Holy Grail" class="holy-grail-img">
        </div>

        <!-- 2. 본제목 -->
        <h1 class="main-title">성배전쟁</h1>

        <!-- 3. 소제목 -->
        <p class="sub-title">온갖 시대, 온갖 나라의 영웅이 현대에 되살아나 힘을 겨루는 살육전</p>
    </main>

    <!-- 화면 우측 하단 워터마크 -->
    <footer class="watermark">Made by 사과사과</footer>

</body>
</html>
