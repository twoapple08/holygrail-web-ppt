<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate/series - 성배전쟁</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-color: #000000;
        }

        /* 메인 배경 이미지 */
        .main-background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('first-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
        }

        .main-background-layer.active {
            opacity: 1;
        }

        /* 화면 아래 붉은 먼지/안개 이펙트 */
        .red-dust-effect {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(to top, rgba(140, 10, 10, 0.35) 0%, rgba(70, 0, 0, 0.15) 50%, transparent 100%);
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            transition: opacity 1.8s ease-in-out;
        }

        .red-dust-effect.active {
            opacity: 0.55;
            animation: dust-fade-soft 5s infinite alternate ease-in-out 1.8s;
        }

        /* --- 수정된 하단 중앙 흰색 텍스트 획득 알림 모션 --- */
        .word-acquire-toast {
            position: absolute;
            bottom: 20%; /* 기존보다 아래로 위치 조정 */
            left: 50%;
            transform: translateX(-50%) translateY(30px); /* 아래에서 시작 */
            z-index: 100;
            color: #ffffff; /* 흰색 텍스트만 */
            font-size: 1.4rem; /* 더 크게 */
            font-weight: 700;
            letter-spacing: 3px;
            text-align: center;
            user-select: none;
            pointer-events: none;
            opacity: 0; /* 투명하게 시작 */
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.5);
            /* 아래에서 위로, 페이드 인/아웃 복합 모션 */
            transition: opacity 0.8s ease-in-out, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .word-acquire-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0); /* 제자리로 */
        }

        /* --- 0. 최초 접속 화면 우측 하단 전체화면 안내 문구 --- */
        .initial-notice-right {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 50;
            font-size: 0.95rem;
            color: rgba(215, 205, 190, 0.7);
            letter-spacing: 1.5px;
            user-select: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 5px rgba(100, 0, 0, 0.8);
            transition: opacity 0.6s ease-out;
            pointer-events: none;
        }

        .initial-notice-right.hide {
            opacity: 0;
        }

        /* --- 1. [시작하기] UI 버튼 --- */
        .start-btn-container {
            position: absolute;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            transform: translateX(2px);
            flex-direction: column;
        }

        .fate-start-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #f5f0e6;
            background: rgba(20, 0, 0, 0.85);
            border: 2px solid #900000;
            padding: 16px 48px;
            letter-spacing: 6px;
            margin-right: -6px;
            cursor: pointer;
            outline: none;
            position: relative;
            box-shadow: 0 0 15px rgba(140, 0, 0, 0.6), inset 0 0 10px rgba(100, 0, 0, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .fate-start-btn:hover {
            color: #ffffff;
            background: rgba(60, 0, 0, 0.95);
            border-color: #ff2222;
            box-shadow: 0 0 25px rgba(255, 30, 30, 0.9), inset 0 0 15px rgba(180, 0, 0, 0.8);
            transform: scale(1.05);
        }

        .start-btn-container.hide {
            opacity: 0;
            transform: translateX(2px) scale(0.9);
            pointer-events: none;
        }

        /* 습득한 단어 동적 추가 컨테이너 (메인 화면 하단) */
        .acquired-words-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            width: 100%;
        }

        .acquired-word-item {
            font-family: 'Song Myung', serif;
            font-size: 1.3rem;
            color: #f5f0e6;
            background: rgba(30, 0, 0, 0.6);
            border: 1px solid #700000;
            padding: 12px 30px;
            letter-spacing: 3px;
            cursor: default;
            user-select: none;
            text-shadow: 0 0 5px rgba(255, 100, 100, 0.5);
            transition: color 0.5s ease, border-color 0.5s ease;
        }

        /* 모든 단어 획득 시 회색빛으로 변하는 상태 */
        .acquired-word-item.all-acquired {
            color: #808080 !important; /* 회색빛 */
            border-color: #444444 !important;
            text-shadow: none !important;
        }

        /* --- 2. 타이틀 컨텐츠 컨테이너 --- */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
            background: transparent;
            margin: 0 auto;
            pointer-events: none;
            transform: translateY(-10px);
        }

        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background: transparent !important;
            margin-bottom: 15px;
            opacity: 0;
        }

        .holy-grail-wrapper.animate {
            animation: grail-smooth-fadein 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .holy-grail-img {
            width: 170px;
            max-width: 100%;
            height: auto;
            animation: grail-gentle-float 3s infinite ease-in-out;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
            display: block;
            margin: 0 auto;
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 7px;
            margin-right: -7px;
            transform: translateX(2px);
            margin-bottom: 12px;
            color: #f5f0e6;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 35px rgba(255, 50, 50, 0.7);
            text-transform: uppercase;
            opacity: 0;
        }

        .main-title.animate {
            animation: fade-in 1.0s ease-out forwards;
        }

        .sub-title {
            font-size: 1.15rem;
            font-weight: 400;
            color: rgba(215, 215, 225, 0.85);
            letter-spacing: 1px;
            margin-right: -1px;
            transform: translateX(2px);
            line-height: 1.6;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 1), 0 0 15px rgba(0, 0, 0, 0.9);
            padding: 0 15px;
            margin-bottom: 35px;
            opacity: 0;
        }

        .sub-title.animate {
            animation: fade-in 1.0s ease-out forwards;
        }

        /* PRESS TO START 버튼 */
        .press-start-wrapper {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-out;
            transform: translateX(2px);
            position: relative;
        }

        .press-start-wrapper.animate {
            opacity: 1;
            pointer-events: auto;
        }

        .press-start-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #a0a0aa;
            letter-spacing: 5px;
            margin-right: -5px;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 0 5px rgba(100, 100, 110, 0.5);
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease, text-shadow 0.3s ease, transform 0.2s ease;
            animation: slow-blink-loop 2.8s infinite alternate ease-in-out;
        }

        .press-start-btn:hover {
            animation-play-state: paused !important;
            opacity: 1 !important;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 8px rgba(255, 255, 255, 0.9);
            transform: scale(1.08);
        }

        .press-start-wrapper.flash-exit {
            animation: simple-flash-fade 0.25s ease-out forwards !important;
            pointer-events: none !important;
        }

        .slow-fade-out {
            animation: pure-fade-out 1.2s ease-out forwards !important;
            pointer-events: none !important;
        }

        /* --- 3. 메인 화면 좌측 하단 유입자 안내 문구 --- */
        .intro-notice-left {
            position: absolute;
            bottom: 25px;
            left: 25px;
            z-index: 20;
            max-width: 500px;
            font-size: 1.05rem;
            color: rgba(230, 220, 205,
