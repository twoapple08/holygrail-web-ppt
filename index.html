<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성배전쟁 - Fate/stay night 테마</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            
            /* 신비로운 마력 안개 및 다중 그라데이션 패턴 배경 */
            background-color: #050508;
            background-image: 
                radial-gradient(circle at 50% 35%, rgba(120, 10, 25, 0.5) 0%, rgba(30, 10, 45, 0.35) 45%, transparent 75%),
                radial-gradient(circle at 15% 85%, rgba(90, 0, 90, 0.3) 0%, transparent 55%),
                radial-gradient(circle at 85% 85%, rgba(150, 20, 20, 0.25) 0%, transparent 55%),
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 50px 50px, 50px 50px;
            background-position: center;
        }

        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 40px 20px;
            position: relative;
        }

        /* 1순위: 본제목을 최상단 레이어로 배치 (z-index 부여) */
        .main-title {
            position: relative;
            z-index: 3;
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 5px;
            margin-bottom: 15px;
            color: #f5f0e6;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 35px rgba(255, 50, 50, 0.7);
            text-transform: uppercase;
            animation: title-glow 3s infinite alternate ease-in-out;
        }

        /* 소제목 영역 */
        .sub-title {
            position: relative;
            z-index: 3;
            font-size: 1.15rem;
            font-weight: 400;
            color: #b5b5c2;
            letter-spacing: 1px;
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
            padding: 0 15px;
        }

        /* 성배 래퍼 (오라만 일렁이도록 설정) */
        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: transparent !important;
            margin-bottom: 25px;
            z-index: 1;
            animation: pulse-aura 4s infinite ease-in-out;
        }

        /* 성배 본체 (위아래로 아주 살짝씩만 움직이도록 미세한 애니메이션 적용) */
        .holy-grail-img {
            width: 180px;
            max-width: 100%;
            height: auto;
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            animation: grail-gentle-float 3s infinite ease-in-out;
        }

        /* 화면 맨 오른쪽 아래 워터마크 */
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 25px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1.5px;
            z-index: 10;
            pointer-events: none;
        }

        /* --- 동적 애니메이션 정의 --- */

        /* 성배 본체가 위아래로 아주 살짝만 움직이는 효과 */
        @keyframes grail-gentle-float {
            0% {
                transform: translateY(0);
                filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.7)) drop-shadow(0 0 40px rgba(200, 20, 40, 0.8));
            }
            50% {
                transform: translateY(-4px);
                filter: drop-shadow(0 0 25px rgba(255, 230, 100, 0.8)) drop-shadow(0 0 50px rgba(255, 40, 60, 0.9));
            }
            100% {
                transform: translateY(0);
                filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.7)) drop-shadow(0 0 40px rgba(200, 20, 40, 0.8));
            }
        }

        /* 성배 주변 오라의 일렁임 효과 */
        @keyframes pulse-aura {
            0% {
                transform: scale(0.98);
                opacity: 0.9;
            }
            50% {
                transform: scale(1.02);
                opacity: 1;
            }
            100% {
                transform: scale(0.98);
                opacity: 0.9;
            }
        }

        /* 타이틀 광채 효과 */
        @keyframes title-glow {
            0% {
                text-shadow: 
                    3px 3px 0px #700000, 
                    -1px -1px 0px #700000, 
                    1px -1px 0px #700000, 
                    -1px 1px 0px #700000,
                    0 0 25px rgba(255, 50, 50, 0.5);
            }
            100% {
                text-shadow: 
                    3px 3px 0px #700000, 
                    -1px -1px 0px #700000, 
                    1px -1px 0px #700000, 
                    -1px 1px 0px #700000,
                    0 0 45px rgba(255, 80, 80, 0.9);
            }
        }
    </style>
</head>
<body>

    <main class="content-container">
        <!-- 본제목 (최상단 레이어) -->
        <h1 class="main-title">성배전쟁</h1>

        <!-- 성배 및 오라 영역 -->
        <div class="holy-grail-wrapper">
            <img src="holygrail.png" alt="Holy Grail" class="holy-grail-img">
        </div>

        <!-- 소제목 -->
        <p class="sub-title">온갖 시대, 온갖 나라의 영웅이 현대에 되살아나 힘을 겨루는 살육전</p>
    </main>

    <!-- 화면 우측 하단 워터마크 -->
    <footer class="watermark">Made by 사과사과</footer>

</body>
</html>
