<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성배전쟁 - Fate/stay night 테마</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            
            /* 화려한 마력 안개 및 다중 그라데이션 패턴 배경 */
            background-color: #050508;
            background-image: 
                radial-gradient(circle at 50% 35%, rgba(120, 10, 25, 0.5) 0%, rgba(30, 10, 45, 0.35) 45%, transparent 75%),
                radial-gradient(circle at 15% 85%, rgba(90, 0, 90, 0.3) 0%, transparent 55%),
                radial-gradient(circle at 85% 85%, rgba(150, 20, 20, 0.25) 0%, transparent 55%),
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 50px 50px, 50px 50px;
            background-position: center;
        }

        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 40px 20px;
            position: relative;
            z-index: 2;
        }

        /* 검은 박스 배경을 제거하고 순수 마력 후광 효과만 남김 */
        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: transparent;
            margin-bottom: 25px;
        }

        .holy-grail-img {
            width: 180px;
            max-width: 100%;
            height: auto;
            /* 성배 뒤로 은은하게 퍼지는 마력 광채 효과 */
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.75)) drop-shadow(0 0 50px rgba(210, 20, 40, 0.85));
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 5px;
            margin-bottom: 15px;
            color: #f5f0e6;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 35px rgba(255, 50, 50, 0.7);
            text-transform: uppercase;
        }

        .sub-title {
            font-size: 1.15rem;
            font-weight: 400;
            color: #b5b5c2;
            letter-spacing: 1px;
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
            padding: 0 15px;
        }
    </style>
</head>
<body>

    <main class="content-container">
        <div class="holy-grail-wrapper">
            <img src="holygrail.png" alt="Holy Grail" class="holy-grail-img">
        </div>

        <h1 class="main-title">성배전쟁</h1>

        <p class="sub-title">온갖 시대, 온갖 나라의 영웅이 현대에 되살아나 힘을 겨루는 살육전</p>
    </main>

</body>
</html>
