<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성배전쟁 - Fate/stay night 테마</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            /* 배경 이미지 지정 및 화면에 가득 차도록 설정 */
            background-image: url('first-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
        }

        /* 배경 이미지 위에 겹쳐질 은은한 마력 오라 레이어 */
        .background-aura {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(80, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.6) 80%);
            z-index: 1;
            animation: pulse-aura 4s infinite alternate ease-in-out;
            pointer-events: none;
        }

        /* 컨텐츠 컨테이너 */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
            background: transparent;
        }

        /* 성배 이미지 래퍼 */
        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: transparent !important;
            margin-bottom: 20px;
        }

        /* 성배 본체 (위아래로 아주 살짝씩만 부유) */
        .holy-grail-img {
            width: 180px;
            max-width: 100%;
            height: auto;
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            animation: grail-gentle-float 3s infinite ease-in-out;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
        }

        /* 본제목: 성배 이미지 바로 아래 배치 */
        .main-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 5px;
            margin-bottom: 12px;
            color: #f5f0e6;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 35px rgba(255, 50, 50, 0.7);
            text-transform: uppercase;
        }

        /* 소제목 */
        .sub-title {
            font-size: 1.15rem;
            font-weight: 400;
            color: #b5b5c2;
            letter-spacing: 1px;
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
            padding: 0 15px;
        }

        /* 화면 맨 오른쪽 아래 워터마크 */
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 25px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1.5px;
            z-index: 20;
            pointer-events: none;
        }

        /* --- 동적 애니메이션 정의 --- */

        @keyframes grail-gentle-float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes pulse-aura {
            0% {
                opacity: 0.4;
                transform: scale(0.98);
            }
            100% {
                opacity: 0.8;
                transform: scale(1.02);
            }
        }
    </style>
</head>
<body>

    <!-- 배경 마력 이펙트 레이어 -->
    <div class="background-aura"></div>

    <!-- 컨텐츠 레이어 -->
    <main class="content-container">
        <!-- 1. 성배 이미지 -->
        <div class="holy-grail-wrapper">
            <img src="holygrail.png" alt="Holy Grail" class="holy-grail-img">
        </div>

        <!-- 2. 본제목 -->
        <h1 class="main-title">성배전쟁</h1>

        <!-- 3. 소제목 -->
        <p class="sub-title">온갖 시대, 온갖 나라의 영웅이 현대에 되살아나 힘을 겨루는 살육전</p>
    </main>

    <!-- 화면 우측 하단 워터마크 -->
    <footer class="watermark">Made by 사과사과</footer>

</body>
</html>
