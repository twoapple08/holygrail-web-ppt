<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성배전쟁 - Fate/stay night 테마</title>
    <!-- 고딕 계열 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        /* 로고 기반 테마 스타일 설정 */
        body {
          margin: 0;
          padding: 0;
          font-family: 'Nanum Gothic', sans-serif;
          /* 순수한 칠흑색 배경 */
          background-color: #000000;
          color: #ffffff;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          overflow-x: hidden;
        }

        .content-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 20px;
          position: relative;
        }

        /* 성배 배경에 로고의 붉은 날개/문양 느낌을 주는 백드롭 효과 */
        .holy-grail-wrapper {
          position: relative;
          padding: 40px;
          border-radius: 50%;
          /* 로고 뒤의 거친 붉은색 마력 번개/문양 실루엣 연출 */
          background: radial-gradient(circle, rgba(160, 0, 0, 0.4) 0%, rgba(80, 0, 0, 0.2) 40%, rgba(0, 0, 0, 0) 70%);
          box-shadow: 0 0 50px rgba(180, 0, 0, 0.3);
          margin-bottom: 20px;
        }

        .holy-grail-img {
          max-width: 220px;
          height: auto;
          /* 성배 입체감 및 붉은 후광 */
          filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6)) drop-shadow(0 0 30px rgba(180, 0, 0, 0.8));
        }

        /* 본제목: 성배전쟁 (로고의 'Fate' 스타일 텍스트 구현) */
        .main-title {
          font-size: 3.5rem;
          font-weight: 800;
          letter-spacing: 3px;
          margin: 10px 0 15px 0;
          /* 대리석 은백색 채움 */
          color: #f0f0f0;
          /* 붉은색 외곽선 및 입체 그림자 */
          text-shadow: 
            3px 3px 0px #8b0000, 
            -1px -1px 0px #8b0000, 
            1px -1px 0px #8b0000, 
            -1px 1px 0px #8b0000,
            0 0 25px rgba(255, 0, 0, 0.5);
          text-transform: uppercase;
        }

        /* 소제목: 조금 어둡고 가라앉은 톤의 설명 텍스트 */
        .sub-title {
          font-size: 1.1rem;
          font-weight: 400;
          color: #8c8c9b;
          letter-spacing: 0.5px;
          margin: 0;
          max-width: 600px;
          line-height: 1.6;
          text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>

    <main class="content-container">
        <!-- 성배 이미지 영역 (로고의 붉은 마력 문양 분위기 통합) -->
        <div class="holy-grail-wrapper">
            <img src="holygrail.png" alt="Holy Grail" class="holy-grail-img">
        </div>

        <!-- 본제목: 성배전쟁 -->
        <h1 class="main-title">성배전쟁</h1>

        <!-- 소제목 -->
        <p class="sub-title">온갖 시대, 온갖 나라의 영웅이 현대에 되살아나 힘을 겨루는 살육전</p>
    </main>

</body>
</html>
