<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성배전쟁 - Fate/stay night 테마</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        /* 초기화 및 레이아웃 안정화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 송명체 적용 */
            font-family: 'Song Myung', serif;
            background-color: #000000;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 중앙 정렬 컨테이너 */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        /* 성배 래퍼 및 마력 백드롭 효과 */
        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(160, 0, 0, 0.4) 0%, rgba(80, 0, 0, 0.2) 40%, rgba(0, 0, 0, 0) 70%);
            box-shadow: 0 0 40px rgba(180, 0, 0, 0.3);
            margin-bottom: 25px;
        }

        .holy-grail-img {
            width: 180px;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6)) drop-shadow(0 0 30px rgba(180, 0, 0, 0.8));
        }

        /* 본제목: 성배전쟁 */
        .main-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 12px;
            color: #f0f0f0;
            text-shadow: 
                3px 3px 0px #8b0000, 
                -1px -1px 0px #8b0000, 
                1px -1px 0px #8b0000, 
                -1px 1px 0px #8b0000,
                0 0 25px rgba(255, 0, 0, 0.5);
            text-transform: uppercase;
        }

        /* 소제목 */
        .sub-title {
            font-size: 1.1rem;
            font-weight: 400;
            color: #8c8c9b;
            letter-spacing: 0.5px;
            max-width: 550px;
            line-height: 1.5;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>

    <main class="content-container">
        <!-- 성배 이미지 영역 -->
        <div class="holy-grail-wrapper">
            <img src="holygrail.png" alt="Holy Grail" class="holy-grail-img">
        </div>

        <!-- 본제목: 성배전쟁 -->
        <h1 class="main-title">성배전쟁</h1>

        <!-- 소제목 -->
        <p class="sub-title">온갖 시대, 온갖 나라의 영웅이 현대에 되살아나 힘을 겨루는 살육전</p>
    </main>

</body>
</html>
