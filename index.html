<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate/series - 성배전쟁</title>
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Song Myung', serif; color: #ffffff; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative; background-color: #000000;
        }
        .main-background-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('first-background.png'); background-size: cover; background-position: center; opacity: 0; pointer-events: none; transition: opacity 1.5s ease-in-out; }
        .main-background-layer.active { opacity: 1; }
        .red-dust-effect { position: absolute; bottom: 0; left: 0; width: 100%; height: 55%; background: linear-gradient(to top, rgba(140, 10, 10, 0.35) 0%, transparent 100%); z-index: 2; pointer-events: none; opacity: 0; transition: opacity 1.8s ease-in-out; }
        .red-dust-effect.active { opacity: 0.55; }
        
        /* 획득 알림 토스트 (흰색 텍스트, 아래에서 위로) */
        .word-acquire-toast {
            position: absolute; bottom: -150px; left: 50%; transform: translateX(-50%);
            z-index: 100; color: #ffffff; font-size: 2.5rem; font-weight: 700;
            text-shadow: 0 0 15px rgba(255, 255, 255, 1); opacity: 0; pointer-events: none;
        }
        .animate-toast { animation: toast-motion 3.5s forwards; }
        @keyframes toast-motion {
            0% { bottom: -150px; opacity: 0; }
            20% { bottom: 400px; opacity: 1; }
            80% { bottom: 420px; opacity: 1; }
            100% { bottom: 500px; opacity: 0; }
        }

        .start-btn-container { position: absolute; z-index: 50; }
        .fate-start-btn { font-family: 'Song Myung', serif; font-size: 1.5rem; color: #f5f0e6; background: rgba(20, 0, 0, 0.85); border: 2px solid #900000; padding: 16px 48px; cursor: pointer; }
        
        .content-container { text-align: center; width: 100%; max-width: 700px; padding: 0 20px; z-index: 10; }
        .center-grail-text-container {
            position: absolute; z-index: 30; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; gap: 20px; opacity: 0; pointer-events: none;
        }
        .center-grail-text-container.show { opacity: 1; pointer-events: auto; }
        .center-grail-btn { font-size: 4rem; color: #fffdfa; background: none; border: none; cursor: pointer; text-shadow: 0 0 20px #700000; }
        
        /* 동적 단어 버튼 스타일 */
        .dynamic-word-btn {
            font-size: 1.8rem; color: #ffd700; background: none; border: 1px solid #900000;
            padding: 10px 20px; cursor: pointer; font-family: 'Song Myung', serif;
        }
        .dynamic-word-btn.grayed { color: #555; border-color: #333; cursor: default; }

        .grail-detail-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 25; display: flex; align-items: center; padding-left: 18%; gap: 16%; opacity: 0; pointer-events: none; }
        .grail-detail-view.show { opacity: 1; pointer-events: auto; }
        .detail-description-right { flex: 1; max-width: 650px; background: rgba(15, 0, 0, 0.75); padding: 40px; border: 1px solid #400; }
        .description-content { font-size: 1.43rem; color: #d0c5b5; }
        .interactive-keyword { color: #ffd700; cursor: pointer; }
        .interactive-keyword.clicked { color: #d0c5b5; cursor: default; }
    </style>
</head>
<body>
    <div class="word-acquire-toast" id="acquireToast"></div>
    <audio id="bgm" src="main-theme.mp3" loop preload="auto"></audio>
    <audio id="pstSfx" src="sfx/sfx-pst.mp3" preload="auto"></audio>
    <audio id="wordSfx" src="sfx/sfx-word.mp3" preload="auto"></audio>
    <audio id="kotomineSfx" src="voice/holygrail-kotomine.mp3" preload="auto"></audio>

    <div class="main-background-layer" id="bgLayer"></div>
    <div class="red-dust-effect" id="dustEffect"></div>

    <div class="start-btn-container" id="btnContainer">
        <button class="fate-start-btn" id="startBtn">시작하기</button>
    </div>

    <main class="content-container">
        <h1 class="main-title" id="mainTitle">성배전쟁</h1>
        <div class="press-start-wrapper" id="pressStartWrapper">
            <button class="press-start-btn" id="pressStartBtn">- PRESS TO START -</button>
        </div>
    </main>

    <!-- Stage 2: 선택지 컨테이너 -->
    <div class="center-grail-text-container" id="centerGrailWrapper">
        <button class="center-grail-btn" id="centerGrailBtn">성배</button>
        <div id="dynamicWordContainer"></div>
    </div>

    <!-- Stage 3: 상세 페이지 -->
    <section class="grail-detail-view" id="grailDetailView">
        <div class="detail-description-right">
            <div class="description-content">
                <span id="kotomineTrigger" style="cursor:pointer; color:#eee;">"성배란, 어떤 소원이라도 이루어주는 원망기다."</span>
                <p>성배가 7명의 <span class="interactive-keyword" data-key="magician">마술사</span>를 <span class="interactive-keyword" data-key="master">마스터</span>로 지정해<br>
                <span class="interactive-keyword" data-key="reiju">령주(令呪)</span>를 부여함과 동시에 <span class="interactive-keyword" data-key="servant">서번트</span> 소환 자격을 얻고<br>
                7명의 마술사가 모두 서번트 소환에 성공하면 성배전쟁은 시작된다.</p>
            </div>
        </div>
        <button id="backBtn">뒤로가기</button>
    </section>

    <script>
        // 초기화 로직
        const acquiredWords = JSON.parse(sessionStorage.getItem('acquiredWords') || '[]');
        const totalKeywords = ['마술사', '마스터', '령주(令呪)', '서번트'];

        function updateChoiceContainer() {
            const container = document.getElementById('dynamicWordContainer');
            container.innerHTML = '';
            acquiredWords.forEach(word => {
                const btn = document.createElement('button');
                btn.className = 'dynamic-word-btn';
                if (acquiredWords.length === totalKeywords.length) btn.classList.add('grayed');
                btn.innerText = word;
                container.appendChild(btn);
            });
        }

        const acquireToast = document.getElementById('acquireToast');
        function showToast(word) {
            acquireToast.innerText = `${word}를 획득했습니다.`;
            acquireToast.classList.add('animate-toast');
            setTimeout(() => acquireToast.classList.remove('animate-toast'), 3500);
        }

        document.querySelectorAll('.interactive-keyword').forEach(el => {
            el.addEventListener('click', function() {
                if (!this.classList.contains('clicked')) {
                    this.classList.add('clicked');
                    const word = this.innerText;
                    
                    // 30% 증폭 음원 재생
                    const sfx = document.getElementById('wordSfx');
                    sfx.volume = Math.min(parseFloat(document.getElementById('seSlider').value) * 1.3, 1.0);
                    sfx.currentTime = 0; sfx.play();
                    
                    showToast(word);
                    acquiredWords.push(word);
                    sessionStorage.setItem('acquiredWords', JSON.stringify(acquiredWords));
                    updateChoiceContainer();
                }
            });
        });

        // 나머지 이벤트 리스너들은 기존 로직과 동일 (단, 스테이지 전환 시 updateChoiceContainer 호출)
        document.getElementById('backBtn').addEventListener('click', updateChoiceContainer);
        // ... (기타 필수 로직 유지)
    </script>
</body>
</html>
