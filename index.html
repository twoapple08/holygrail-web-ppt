<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate/Web Project - Holy Grail</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
          margin: 0;
          padding: 0;
          font-family: 'Nanum Gothic', sans-serif;
          background: radial-gradient(circle at center, #1a1a3a 0%, #0a0a1a 100%);
          background-image:
            radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
            radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
            radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
          background-size: 550px 550px, 350px 350px, 250px 250px;
          background-position: 0 0, 40px 60px, 130px 270px;
          color: #e0e0e0;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-start;
        }

        h1.main-title {
          font-size: 3.5em;
          font-weight: 800;
          text-align: center;
          text-transform: uppercase;
          letter-spacing: 5px;
          color: #d4af37;
          text-shadow:
            2px 2px 0 #8b0000,
            4px 4px 0 rgba(0,0,0,0.5),
            0 0 20px #d4af37;
          margin-top: 8vh;
          margin-bottom: 20px;
        }

        .holy-grail-section {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          margin-top: 30px;
          text-align: center;
        }

        .holy-grail-container {
          position: relative;
          padding: 20px;
          background: radial-gradient(circle, rgba(212, 175, 55, 0.3) 0%, rgba(0,0,0,0) 70%);
          border-radius: 50%;
        }

        .holy-grail-image {
          max-width: 250px;
          height: auto;
          filter: drop-shadow(0 0 15px #d4af37) drop-shadow(0 0 30px #8b0000);
          animation: grail-breathing 3s infinite ease-in-out;
        }

        .grail-description {
          font-size: 1.4em;
          margin-top: 25px;
          font-style: italic;
          letter-spacing: 1px;
        }

        .action-section {
          margin-top: 40px;
        }

        .fate-button {
          background: linear-gradient(to bottom, #8b0000, #4a0000);
          color: #fff;
          border: 2px solid #d4af37;
          padding: 15px 35px;
          font-size: 1.2em;
          font-weight: bold;
          border-radius: 5px;
          cursor: pointer;
          transition: all 0.3s ease;
          box-shadow: 0 5px 15px rgba(0,0,0,0.5);
          letter-spacing: 1px;
        }

        .fate-button:hover {
          background: linear-gradient(to bottom, #a00000, #600000);
          box-shadow: 0 0 25px #d4af37;
          transform: translateY(-2px);
        }

        .mana-highlight {
          color: #d4af37;
          text-shadow: 0 0 8px rgba(212, 175, 55, 0.8);
        }

        @keyframes grail-breathing {
          0% {
            transform: scale(1);
            filter: drop-shadow(0 0 15px #d4af37) drop-shadow(0 0 30px #8b0000);
          }
          50% {
            transform: scale(1.05);
            filter: drop-shadow(0 0 25px #d4af37) drop-shadow(0 0 50px #ff4500);
          }
          100% {
            transform: scale(1);
            filter: drop-shadow(0 0 15px #d4af37) drop-shadow(0 0 30px #8b0000);
          }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="main-title">Fate/Web Project</h1>
    </header>

    <main>
        <section class="holy-grail-section">
            <div class="holy-grail-container">
                <img src="holygrail.png" alt="Holy Grail" class="holy-grail-image">
            </div>
            <p class="grail-description mana-highlight">만능의 원망기, 성배가 여기에 현현하다.</p>
        </section>

        <section class="action-section">
            <button class="fate-button">령주를 가지고 명한다</button>
        </section>
    </main>

</body>
</html>
