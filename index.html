<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성배전쟁 - Fate/stay night 테마</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            
            /* 신비로운 마력 회로/안개 느낌의 다중 그라데이션 및 패턴 배경 */
            background-color: #050508;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(110, 10, 20, 0.45) 0%, rgba(25, 10, 40, 0.3) 40%, transparent 70%),
                radial-gradient(circle at 20% 80%, rgba(80, 0, 80, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(140, 20, 20, 0.2) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            background-position: center;
        }

        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 40px 20px;
            position: relative;
            z-index: 2;
        }

        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200, 20, 20, 0.35) 0%, rgba(100, 0, 50, 0.15) 50%, rgba(0, 0, 0, 0) 75%);
            box-shadow: 0 0 70px rgba(220, 20, 60, 0.3);
            margin-bottom: 30px;
        }

        .holy-grail-img {
            width: 180px;
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8)) drop-shadow(0 0 40px rgba(200, 0, 0, 0.9));
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 5px;
            margin-bottom: 15px;
            color: #f5f0e6;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 35px rgba(255, 50, 50, 0.7);
            text-transform: uppercase;
        }

        .sub-title {
            font-size: 1.15rem;
            font-weight: 400;
            color: #b5b5c2;
            letter-spacing: 1px;
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
            padding: 0 15px;
        }
    </style>
</head>
<body>

    <main class="content-container">
        <div class="holy-grail-wrapper">
            <img src="holygrail.png" alt="Holy Grail" class="holy-grail-img">
        </div>

        <h1 class="main-title">성배전쟁</h1>

        <p class="sub-title">온갖 시대, 온갖 나라의 영웅이 현대에 되살아나 힘을 겨루는 살육전</p>
    </main>

</body>
</html>
