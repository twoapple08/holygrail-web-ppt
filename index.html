<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate/series - 성배전쟁</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-color: #000000; /* 초기 검은색 배경 */
        }

        /* 메인 배경 이미지 (초기 숨김, 클릭 후 페이드인) */
        .main-background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('first-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
        }

        /* 클릭 후 배경 활성화 클래스 */
        .main-background-layer.active {
            opacity: 1;
        }

        /* 화면 아래 붉은 먼지/안개 이펙트 */
        .red-dust-effect {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(to top, rgba(140, 10, 10, 0.35) 0%, rgba(70, 0, 0, 0.15) 50%, transparent 100%);
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            transition: opacity 1.8s ease-in-out;
        }

        /* 붉은 안개 활성화 시 은은한 상승 및 루프 동기화 */
        .red-dust-effect.active {
            opacity: 0.55;
            animation: dust-fade-soft 5s infinite alternate ease-in-out 1.8s;
        }

        /* --- Fate/stay night 스타일 시작하기 버튼 --- */
        .start-btn-container {
            position: absolute;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            transform: translateX(2px);
        }

        .fate-start-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #f5f0e6;
            background: rgba(20, 0, 0, 0.85);
            border: 2px solid #900000;
            padding: 16px 48px;
            letter-spacing: 6px;
            margin-right: -6px;
            cursor: pointer;
            outline: none;
            position: relative;
            box-shadow: 0 0 15px rgba(140, 0, 0, 0.6), inset 0 0 10px rgba(100, 0, 0, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .fate-start-btn:hover {
            color: #ffffff;
            background: rgba(60, 0, 0, 0.95);
            border-color: #ff2222;
            box-shadow: 0 0 25px rgba(255, 30, 30, 0.9), inset 0 0 15px rgba(180, 0, 0, 0.8);
            transform: scale(1.05);
        }

        /* 버튼 퇴장 클래스 */
        .start-btn-container.hide {
            opacity: 0;
            transform: translateX(2px) scale(0.9);
            pointer-events: none;
        }

        /* 컨텐츠 컨테이너 (성배 및 타이틀 Y축 중앙 정렬) */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
            background: transparent;
            margin: 0 auto;
            pointer-events: none;
            transform: translateY(-10px);
        }

        /* 성배 이미지 래퍼 */
        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background: transparent !important;
            margin-bottom: 15px;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .holy-grail-wrapper.animate {
            animation: grail-smooth-fadein 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .holy-grail-img {
            width: 170px;
            max-width: 100%;
            height: auto;
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            animation: grail-gentle-float 3s infinite ease-in-out;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
            display: block;
            margin: 0 auto;
        }

        /* 본제목 */
        .main-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 7px;
            margin-right: -7px;
            transform: translateX(2px);
            margin-bottom: 12px;
            color: #f5f0e6;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 35px rgba(255, 50, 50, 0.7);
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .main-title.animate {
            animation: fade-in 1.0s ease-out forwards;
        }

        /* 소제목 */
        .sub-title {
            font-size: 1.15rem;
            font-weight: 400;
            color: rgba(215, 215, 225, 0.85);
            letter-spacing: 1px;
            margin-right: -1px;
            transform: translateX(2px);
            line-height: 1.6;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 1), 0 0 15px rgba(0, 0, 0, 0.9);
            padding: 0 15px;
            margin-bottom: 35px;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sub-title.animate {
            animation: fade-in 1.0s ease-out forwards;
        }

        /* --- PRESS TO START 버튼 감싸는 페이드인 래퍼 --- */
        .press-start-wrapper {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            transform: translateX(2px);
            position: relative;
        }

        .press-start-wrapper.animate {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- 느리게 깜빡이는 PRESS TO START 본체 --- */
        .press-start-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #a0a0aa;
            letter-spacing: 5px;
            margin-right: -5px;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 0 5px rgba(100, 100, 110, 0.5);
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease, text-shadow 0.3s ease, transform 0.2s ease;
            
            animation: slow-blink-loop 2.8s infinite alternate ease-in-out;
        }

        .press-start-btn:hover {
            animation-play-state: paused !important;
            opacity: 1 !important;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 8px rgba(255, 255, 255, 0.9);
            transform: scale(1.08);
        }

        /* --- 프투스 전용 섬광 후 빠른 소멸 클래스 --- */
        .press-start-wrapper.flash-exit {
            animation: simple-flash-fade 0.25s ease-out forwards !important;
            pointer-events: none !important;
        }

        /* --- 성배 및 제목 전용 천천히 페이드아웃 퇴장 클래스 --- */
        .slow-fade-out {
            animation: none !important;
            opacity: 0 !important;
            transform: translateY(-8px) scale(0.96) !important;
            pointer-events: none !important;
        }

        /* --- 화면 좌측 하단 고정 레이아웃 ((화살표)뒤로가기 버튼) --- */
        .bottom-left-controls {
            position: absolute;
            bottom: 20px;
            left: 25px;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }

        /* 타이틀 요소 완파 후 좌측 하단 등장 */
        .bottom-left-controls.show {
            opacity: 1;
            pointer-events: auto;
        }

        .fate-back-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.0rem;
            font-weight: 700;
            color: #c0c0c8;
            background: rgba(20, 0, 0, 0.6);
            border: 1px solid rgba(160, 0, 0, 0.7);
            padding: 8px 24px;
            letter-spacing: 2px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 10px rgba(100, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .fate-back-btn:hover {
            color: #ffffff;
            background: rgba(50, 0, 0, 0.8);
            border-color: #ff4444;
            box-shadow: 0 0 18px rgba(255, 50, 50, 0.7);
            transform: scale(1.03);
        }

        /* --- 화면 우측 하단 레이아웃 (SFX/BGM 조절기 + 워터마크) --- */
        .bottom-right-controls {
            position: absolute;
            bottom: 20px;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
        }

        .bottom-right-controls.animate {
            pointer-events: auto;
            animation: fade-in 1.2s ease-out forwards;
        }

        /* Fate 테마 볼륨 조절 스파이크 패널 */
        .sound-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(15, 0, 0, 0.7);
            border: 1px solid rgba(140, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(80, 0, 0, 0.6);
            backdrop-filter: blur(3px);
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .volume-label {
            font-size: 0.75rem;
            color: #d0c5b5;
            letter-spacing: 1px;
            font-weight: 700;
            user-select: none;
            min-width: 30px;
            text-align: left;
        }

        /* 커스텀 볼륨 range 슬라이더 */
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(80, 10, 10, 0.8);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff3333;
            border: 1px solid #ffffff;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
            background: #ff6666;
        }

        /* 화면 우측 하단 워터마크 */
        .watermark {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1.5px;
            user-select: none;
            margin-top: 2px;
        }

        /* --- 키프레임 애니메이션 정의 --- */

        /* 단순 발광 후 빠른 페이드아웃 모션 */
        @keyframes simple-flash-fade {
            0% {
                opacity: 1;
                filter: brightness(1);
                color: #ffffff;
            }
            30% {
                opacity: 1;
                filter: brightness(5) drop-shadow(0 0 20px #ffffff);
                color: #ffffff;
            }
            100% {
                opacity: 0;
                filter: brightness(8);
                color: #ffffff;
                transform: translateX(2px) scale(0.95);
            }
        }

        @keyframes slow-blink-loop {
            0% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.85;
            }
            100% {
                opacity: 0.2;
            }
        }

        @keyframes grail-smooth-fadein {
            0% {
                opacity: 0;
                transform: scale(0.96);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes grail-gentle-float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes dust-fade-soft {
            0% { opacity: 0.5; }
            100% { opacity: 0.75; }
        }

        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- BGM 오디오 레이어 (무한 반복) -->
    <audio id="bgm" src="main-theme.mp3" loop preload="auto"></audio>

    <!-- 프투스 클릭 시 효과음 레이어 -->
    <audio id="pstSfx" src="pst.mp3" preload="auto"></audio>

    <!-- 1. 메인 배경 이미지 레이어 -->
    <div class="main-background-layer" id="bgLayer"></div>

    <!-- 2. 화면 아래쪽 붉은 먼지/안개 이펙트 레이어 -->
    <div class="red-dust-effect" id="dustEffect"></div>

    <!-- 3. 페스나 스타일 [시작하기] UI 버튼 컨테이너 -->
    <div class="start-btn-container" id="btnContainer">
        <button class="fate-start-btn" id="startBtn">시작하기</button>
    </div>

    <!-- 4. 컨텐츠 레이어 (성배 및 타이틀 Y축 중앙 정렬) -->
    <main class="content-container">
        <div class="holy-grail-wrapper" id="grailWrapper">
            <img src="holygrail.png" alt="Holy Grail" class="holy-grail-img">
        </div>

        <h1 class="main-title" id="mainTitle">성배전쟁</h1>

        <p class="sub-title" id="subTitle">온갖 시대, 온갖 나라의 영웅이 현대에 되살아나 힘을 겨루는 살육전</p>

        <!-- 소제목 아래 위치한 회색 PRESS TO START 버튼 (페이드인 래퍼) -->
        <div class="press-start-wrapper" id="pressStartWrapper">
            <button class="press-start-btn" id="pressStartBtn">- PRESS TO START -</button>
        </div>
    </main>

    <!-- 화면 좌측 하단 레이아웃 (타이틀 퇴장 후 등장하는 (화살표)뒤로가기 버튼) -->
    <div class="bottom-left-controls" id="backBtnWrapper">
        <button class="fate-back-btn" id="backBtn">⇦ 뒤로가기</button>
    </div>

    <!-- 화면 우측 하단 사운드 컨트롤러 레이어 (SFX/BGM 슬라이더 + 워터마크) -->
    <div class="bottom-right-controls" id="controlsGroup">
        <div class="sound-panel">
            <!-- 효과음(SFX) 볼륨 조절 슬라이더 (기본값 10%) -->
            <div class="volume-control-box">
                <span class="volume-label">SFX</span>
                <input type="range" id="seSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.1">
            </div>
            <!-- 배경음(BGM) 볼륨 조절 슬라이더 (기본값 10%) -->
            <div class="volume-control-box">
                <span class="volume-label">BGM</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.1">
            </div>
        </div>
        <footer class="watermark">Made by 사과사과</footer>
    </div>

    <script>
        const bgm = document.getElementById('bgm');
        const pstSfx = document.getElementById('pstSfx');
        const volumeSlider = document.getElementById('volumeSlider');
        const seSlider = document.getElementById('seSlider');
        const pressStartBtn = document.getElementById('pressStartBtn');

        const grailWrapper = document.getElementById('grailWrapper');
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');
        const pressStartWrapper = document.getElementById('pressStartWrapper');
        const backBtnWrapper = document.getElementById('backBtnWrapper');
        const backBtn = document.getElementById('backBtn');

        // BGM 슬라이더 변경 시 즉시 BGM 볼륨 조절
        volumeSlider.addEventListener('input', function() {
            if (bgm) {
                bgm.volume = parseFloat(this.value);
            }
        });

        // SFX 슬라이더 변경 시 즉시 효과음 볼륨 조절
        seSlider.addEventListener('input', function() {
            if (pstSfx) {
                pstSfx.volume = parseFloat(this.value);
            }
        });

        // SFX 슬라이더 조작 완료(드래그 종료) 시 볼륨 샘플 체감 재생
        seSlider.addEventListener('change', function() {
            if (pstSfx) {
                pstSfx.currentTime = 0;
                pstSfx.play().catch(error => {
                    console.log("SFX 샘플 재생 예외 발생:", error);
                });
            }
        });

        // 프투스 클릭 시 연출: pst.mp3 재생 -> 백색 섬광 발광 후 빠르게 소멸 -> 성배 및 제목 천천히 페이드아웃 -> 좌측 하단 뒤로가기 등장
        pressStartBtn.addEventListener('click', function() {
            // 1. 클릭 효과음 재생 (SFX 슬라이더 음량 반영)
            if (pstSfx) {
                pstSfx.volume = parseFloat(seSlider.value);
                pstSfx.currentTime = 0;
                pstSfx.play().catch(error => {
                    console.log("pst.mp3 재생 예외 발생:", error);
                });
            }

            // 2. 프투스 버튼 순백색 섬광 후 빠르게 소멸 (0.0초)
            pressStartWrapper.classList.add('flash-exit');

            // 3. 프투스 소멸 후(0.4초 뒤), 성배 이미지 및 제목들이 천천히 페이드아웃 시작
            setTimeout(() => {
                grailWrapper.classList.add('slow-fade-out');
                mainTitle.classList.add('slow-fade-out');
                subTitle.classList.add('slow-fade-out');
            }, 400);

            // 4. 타이틀 요소들이 완전히 천천히 다 사라진 시점(0.4s + 0.8s 트랜지션 = 1.2s 후), 좌측 하단 뒤로가기 버튼 등장
            setTimeout(() => {
                backBtnWrapper.classList.add('show');
                console.log("모든 타이틀 요소가 사라지고 좌측 하단 뒤로가기 버튼이 활성화되었습니다.");
            }, 1200);
        });

        // 뒤로가기 버튼 클릭 시 역재생 상호작용 연출
        backBtn.addEventListener('click', function() {
            // 1. 뒤로가기 버튼 자체 페이드아웃
            backBtnWrapper.classList.remove('show');

            // 2. 성배 이미지, 본제목, 소제목 페이드인 복원 (0.2초 시점)
            setTimeout(() => {
                grailWrapper.classList.remove('slow-fade-out');
                mainTitle.classList.remove('slow-fade-out');
                subTitle.classList.remove('slow-fade-out');
            }, 200);

            // 3. 프투스 버튼 섬광 퇴장 클래스 제거하여 재생성 및 점멸 활성화 (1.0초 시점)
            setTimeout(() => {
                pressStartWrapper.classList.remove('flash-exit');
            }, 1000);
        });

        document.getElementById('startBtn').addEventListener('click', function() {
            const btnContainer = document.getElementById('btnContainer');
            const bgLayer = document.getElementById('bgLayer');
            const dustEffect = document.getElementById('dustEffect');
            const controlsGroup = document.getElementById('controlsGroup');

            // 1. 시작 버튼 사라짐
            btnContainer.classList.add('hide');

            // 2. BGM & SFX 초기 음량 할당(10%) 및 BGM 0.7초(700ms) 지연 재생
            if (bgm) {
                bgm.volume = parseFloat(volumeSlider.value);
                setTimeout(() => {
                    bgm.play().catch(error => {
                        console.log("BGM 재생 예외 발생:", error);
                    });
                }, 700);
            }

            if (pstSfx) {
                pstSfx.volume = parseFloat(seSlider.value);
            }

            // 3. 배경 이미지 페이드인
            setTimeout(() => {
                bgLayer.classList.add('active');
            }, 300);

            // 4. 은은한 붉은 안개 이펙트 연출
            setTimeout(() => {
                dustEffect.classList.add('active');
            }, 500);

            // 5. 성배 이미지 페이드인
            setTimeout(() => {
                grailWrapper.classList.add('animate');
            }, 1400);

            // 6. 본제목 페이드인
            setTimeout(() => {
                mainTitle.classList.add('animate');
            }, 2200);

            // 7. 소제목, 워터마크 및 사운드 컨트롤러 페이드인 (2.8초)
            setTimeout(() => {
                subTitle.classList.add('animate');
                controlsGroup.classList.add('animate');
            }, 2800);

            // 8. PRESS TO START: 소제목 등장 0.7초 뒤(3.5초) 부드럽게 등장
            setTimeout(() => {
                pressStartWrapper.classList.add('animate');
            }, 3500);
        });
    </script>
</body>
</html>
