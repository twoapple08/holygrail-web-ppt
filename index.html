<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate/series</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-color: #000000;
        }

        /* 메인 배경 이미지 */
        .main-background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('first-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
        }

        .main-background-layer.active {
            opacity: 1;
        }

        /* 화면 아래 붉은 먼지/안개 이펙트 */
        .red-dust-effect {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(to top, rgba(140, 10, 10, 0.35) 0%, rgba(70, 0, 0, 0.15) 50%, transparent 100%);
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            transition: opacity 1.8s ease-in-out;
        }

        .red-dust-effect.active {
            opacity: 0.55;
            animation: dust-fade-soft 5s infinite alternate ease-in-out 1.8s;
        }

        /* --- 신규개념 획득 알림 모션 --- */
        #acquireToastContainer {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            pointer-events: none;
            width: 100%;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 10px;
        }

        .word-toast-item {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            opacity: 0;
            animation: float-fade-smooth 1.8s forwards linear;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 5px rgba(255, 215, 0, 0.6);
            user-select: none;
            white-space: nowrap;
            will-change: transform, opacity;
        }

        @keyframes float-fade-smooth {
            0% { transform: translateY(35px); opacity: 0; }
            50% { transform: translateY(0px); opacity: 1; }
            100% { transform: translateY(-35px); opacity: 0; }
        }

        /* --- 신규개념 (노란색 하이라이트 키워드) --- */
        .interactive-keyword {
            color: #ffd700 !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            pointer-events: auto !important;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
            transition: color 0.3s ease, text-shadow 0.3s ease;
            user-select: none;
            display: inline-block;
            position: relative;
            z-index: 1000;
        }

        .interactive-keyword:hover {
            color: #ffffff !important;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
        }

        .interactive-keyword.clicked {
            color: #d0c5b5 !important;
            font-weight: 400 !important;
            cursor: default !important;
            text-shadow: none !important;
            pointer-events: none !important;
        }

        /* --- 어록 속성 (최우선 클릭권 확보) --- */
        .description-quote {
            font-style: italic;
            color: rgba(200, 190, 175, 0.75);
            display: inline-block;
            cursor: pointer !important;
            pointer-events: auto !important;
            position: relative;
            z-index: 1000;
            user-select: none;
            animation: quote-gentle-glow 2.5s infinite alternate ease-in-out;
            transition: color 0.3s ease, transform 0.2s ease, text-shadow 0.3s ease;
        }

        .description-quote:hover {
            color: #ffffff !important;
            transform: scale(1.02);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 255, 255, 0.6) !important;
        }

        .description-quote.glow-fade-out {
            animation: none !important;
            text-shadow: none !important;
        }

        @keyframes quote-gentle-glow {
            0% { text-shadow: 0 0 3px rgba(200, 190, 175, 0.2); }
            100% { text-shadow: 0 0 10px rgba(220, 210, 195, 0.5), 0 0 16px rgba(200, 190, 175, 0.3); }
        }

        /* --- 1. [시작하기] UI 컨테이너 --- */
        .start-btn-container {
            position: absolute;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 70px;
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        .fate-start-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #f5f0e6;
            background: rgba(20, 0, 0, 0.85);
            border: 2px solid #900000;
            padding: 16px 48px;
            letter-spacing: 6px;
            margin-right: -6px;
            cursor: pointer;
            outline: none;
            position: relative;
            box-shadow: 0 0 15px rgba(140, 0, 0, 0.6), inset 0 0 10px rgba(100, 0, 0, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .fate-start-btn:hover {
            color: #ffffff;
            background: rgba(60, 0, 0, 0.95);
            border-color: #ff2222;
            box-shadow: 0 0 25px rgba(255, 30, 30, 0.9), inset 0 0 15px rgba(180, 0, 0, 0.8);
            transform: scale(1.05);
        }

        .start-btn-container.hide {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .initial-notice-center {
            font-size: 0.95rem;
            color: rgba(215, 205, 190, 0.7);
            letter-spacing: 1.5px;
            user-select: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 5px rgba(100, 0, 0, 0.8);
            transition: opacity 0.6s ease-out;
            pointer-events: none;
        }

        /* --- 2. 메인 화면 컨테이너 --- */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
            background: transparent;
            margin: 0 auto;
            pointer-events: none;
            transform: translateY(-10px);
        }

        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background: transparent !important;
            margin-bottom: 25px;
            opacity: 0;
        }

        .holy-grail-wrapper.animate {
            animation: grail-smooth-fadein 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .fate-logo-img {
            width: 270px;
            max-width: 100%;
            height: auto;
            animation: grail-gentle-float 3s infinite ease-in-out;
            filter: drop-shadow(0 0 22px rgba(200, 20, 20, 0.85));
            display: block;
            margin: 0 auto;
        }

        .sub-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1.5px;
            transform: translateX(2px);
            line-height: 1.6;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 2px 10px rgba(0, 0, 0, 1);
            padding: 0 15px;
            margin-bottom: 35px;
            opacity: 0;
        }

        .sub-title.animate {
            animation: fade-in 1.0s ease-out forwards;
        }

        .extended-dash {
            letter-spacing: 4px;
            margin: 0 2px;
        }

        .press-start-wrapper {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-out;
            transform: translateX(2px);
            position: relative;
        }

        .press-start-wrapper.animate {
            opacity: 1;
            pointer-events: auto;
        }

        .press-start-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #a0a0aa;
            letter-spacing: 5px;
            margin-right: -5px;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 0 5px rgba(100, 100, 110, 0.5);
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease, text-shadow 0.3s ease, transform 0.2s ease;
            animation: slow-blink-loop 2.8s infinite alternate ease-in-out;
        }

        .press-start-btn:hover {
            animation-play-state: paused !important;
            opacity: 1 !important;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 8px rgba(255, 255, 255, 0.9);
            transform: scale(1.08);
        }

        .press-start-wrapper.flash-exit {
            animation: simple-flash-fade 0.25s ease-out forwards !important;
            pointer-events: none !important;
        }

        .slow-fade-out {
            animation: pure-fade-out 1.2s ease-out forwards !important;
            pointer-events: none !important;
        }

        /* --- 3. 유입자 안내 문구 --- */
        .intro-notice-left {
            position: absolute;
            bottom: 25px;
            left: 25px;
            z-index: 20;
            max-width: 500px;
            font-size: 1.05rem;
            color: rgba(230, 220, 205, 0.65);
            letter-spacing: 1px;
            line-height: 1.45;
            user-select: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 5px rgba(100, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            word-break: keep-all;
        }

        .intro-notice-left.animate {
            animation: fade-in 1.2s ease-out forwards;
        }

        .intro-notice-left.slow-fade-out {
            animation: pure-fade-out 1.2s ease-out forwards !important;
        }

        /* --- 4. 마력 회로 전용 탭 캔버스 영역 --- */
        .tab-selection-container {
            position: absolute;
            z-index: 30;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
        }

        .tab-selection-container.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* SVG 마력 회로 (좌표 고정형) */
        .magic-circuit-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 31;
        }

        .circuit-line {
            stroke: #ff2222;
            stroke-width: 4px;
            fill: none;
            filter: drop-shadow(0 0 8px #ff0000) drop-shadow(0 0 16px rgba(255, 30, 30, 0.9));
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            transition: stroke-dashoffset 0.8s cubic-bezier(0.25, 1, 0.25, 1);
        }

        /* 개별 탭 노드 (절대 퍼센트 좌표 고정) */
        .circuit-node-box {
            position: absolute;
            transform: translate(-50%, -50%);
            transition: opacity 0.8s ease-in-out;
            z-index: 34;
        }

        .tab-item-btn {
            font-family: 'Song Myung', serif;
            font-weight: 700;
            color: #fffdfa;
            letter-spacing: 12px;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 40px rgba(255, 215, 0, 0.8);
            transition: transform 0.3s ease, color 0.3s ease, text-shadow 0.3s ease;
        }

        .tab-item-btn:hover {
            color: #ffffff;
            transform: scale(1.08);
            text-shadow: 0 0 50px rgba(255, 230, 100, 1), 0 0 20px rgba(255, 255, 255, 0.9);
        }

        /* 클론 비행 객체 */
        .ghost-tab-clone {
            position: fixed;
            z-index: 999;
            pointer-events: none;
            font-family: 'Song Myung', serif;
            font-weight: 700;
            color: #fffdfa;
            letter-spacing: 12px;
            white-space: nowrap;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 40px rgba(255, 215, 0, 0.8);
            transform-origin: top left;
            transition: top 1.0s cubic-bezier(0.25, 1, 0.25, 1), 
                        left 1.0s cubic-bezier(0.25, 1, 0.25, 1), 
                        transform 1.0s cubic-bezier(0.25, 1, 0.25, 1),
                        filter 1.0s ease-in-out;
            will-change: top, left, transform;
        }

        .ghost-tab-clone.move-to-target {
            top: 7vh !important;
            left: 6vw !important;
            transform: scale(0.75) !important;
            filter: brightness(1.3) drop-shadow(0 0 15px rgba(255, 220, 120, 0.9));
        }

        /* --- 5. 상세 페이지 일반 레이아웃 (Z-index 55 보장) --- */
        .tab-detail-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 25; 
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-left: 18%;
            gap: 16%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
        }

        .tab-detail-view.show {
            z-index: 55 !important;
            opacity: 1;
            pointer-events: auto;
        }

        .detail-left-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 280px;
        }

        .detail-img {
            width: 280px;
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.7));
            animation: grail-gentle-float 3.5s infinite ease-in-out;
        }

        .detail-sub-label {
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 400;
            color: rgba(215, 205, 190, 0.65);
            letter-spacing: 2px;
            user-select: none;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 4px rgba(100, 0, 0, 0.5);
        }

        .detail-right-box {
            flex: 1;
            max-width: 650px;
            background: rgba(15, 0, 0, 0.75);
            border: 2px solid rgba(160, 0, 0, 0.8);
            border-radius: 8px;
            padding: 30px 35px 40px 35px;
            box-shadow: 0 0 25px rgba(100, 0, 0, 0.7), inset 0 0 15px rgba(80, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            position: relative;
            z-index: 5;
            pointer-events: auto;
        }

        .description-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #f5f0e6;
            letter-spacing: 2px;
            margin-top: -6px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(180, 0, 0, 0.6);
            padding-bottom: 12px;
            text-shadow: 0 0 12px rgba(255, 50, 50, 0.7);
        }

        .description-content {
            font-size: 1.43rem;
            line-height: 1.85;
            color: #d0c5b5;
            letter-spacing: 1px;
            word-break: keep-all;
        }

        .description-quote-author {
            font-style: normal;
            font-size: 1.15rem;
            color: #a08a75;
            display: block;
            margin-top: 4px;
            margin-bottom: 16px;
            text-align: right;
            user-select: none;
        }

        /* --- 6. 뒤로가기 버튼 --- */
        .bottom-left-controls {
            position: absolute;
            bottom: 20px;
            left: 25px;
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
        }

        .bottom-left-controls.show {
            opacity: 1;
            pointer-events: auto;
        }

        .fate-back-btn {
            font-family: 'Song Myung', serif;
            font-size: 1.0rem;
            font-weight: 700;
            color: #c0c0c8;
            background: rgba(20, 0, 0, 0.6);
            border: 1px solid rgba(160, 0, 0, 0.7);
            padding: 8px 24px;
            letter-spacing: 2px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 10px rgba(100, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .fate-back-btn:hover {
            color: #ffffff;
            background: rgba(50, 0, 0, 0.8);
            border-color: #ff4444;
            box-shadow: 0 0 18px rgba(255, 50, 50, 0.7);
            transform: scale(1.03);
        }

        /* --- 7. 우측 하단 컨트롤러 --- */
        .bottom-right-controls {
            position: absolute;
            bottom: 20px;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 60;
            opacity: 0;
            pointer-events: none;
        }

        .bottom-right-controls.animate {
            pointer-events: auto;
            animation: fade-in 1.2s ease-out forwards;
        }

        .sound-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(15, 0, 0, 0.7);
            border: 1px solid rgba(140, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(80, 0, 0, 0.6);
            backdrop-filter: blur(3px);
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .volume-label {
            font-size: 0.75rem;
            color: #d0c5b5;
            letter-spacing: 1px;
            font-weight: 700;
            user-select: none;
            min-width: 40px;
            text-align: left;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(80, 10, 10, 0.8);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff3333;
            border: 1px solid #ffffff;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
            background: #ff6666;
        }

        .watermark {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1.5px;
            user-select: none;
            margin-top: 2px;
        }

        /* --- 키프레임 --- */
        @keyframes pure-fade-out { 0% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes simple-flash-fade {
            0% { opacity: 1; filter: brightness(1); color: #ffffff; }
            30% { opacity: 1; filter: brightness(5) drop-shadow(0 0 20px #ffffff); color: #ffffff; }
            100% { opacity: 0; filter: brightness(8); color: #ffffff; transform: translateX(2px) scale(0.95); }
        }
        @keyframes slow-blink-loop { 0% { opacity: 0.2; } 50% { opacity: 0.85; } 100% { opacity: 0.2; } }
        @keyframes grail-smooth-fadein { 0% { opacity: 0; transform: scale(0.96); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes grail-gentle-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes dust-fade-soft { 0% { opacity: 0.5; } 100% { opacity: 0.75; } }
        @keyframes fade-in { 0% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="acquireToastContainer"></div>

    <audio id="bgm" src="main-theme.mp3" loop preload="auto"></audio>
    <audio id="pstSfx" src="sfx/sfx-pst.mp3" preload="auto"></audio>
    <audio id="wordSfx" src="sfx/sfx-word.mp3" preload="auto"></audio>
    <audio id="noshinSfx" src="sfx/sfx-noshin.mp3" preload="auto"></audio>
    <audio id="kotomineSfx" src="voice/holygrail-kotomine.mp3" preload="auto"></audio>

    <div class="main-background-layer" id="bgLayer"></div>
    <div class="red-dust-effect" id="dustEffect"></div>

    <div class="start-btn-container" id="btnContainer">
        <button class="fate-start-btn" id="startBtn">시작하기</button>
        <div class="initial-notice-center" id="initialNotice">
            ※이 사이트는 컴퓨터 전체화면을 기준으로 제작되었습니다.
        </div>
    </div>

    <main class="content-container">
        <div class="holy-grail-wrapper" id="grailWrapper">
            <img src="Fate.png" alt="Fate Logo" class="fate-logo-img">
        </div>
        <p class="sub-title" id="subTitle">성배와 영령<span class="extended-dash">—</span>그리고 운명의 이야기</p>
        <div class="press-start-wrapper" id="pressStartWrapper">
            <button class="press-start-btn" id="pressStartBtn">- PRESS TO START -</button>
        </div>
    </main>

    <div class="intro-notice-left" id="introNotice">
        ※유입자를 위해 만들어진 사이트이니 생략되거나 스포일러 때문에 진실과는 다르게 설명한 것들이 있을 수 있습니다.
    </div>

    <!-- 2단계: 마력 회로 전용 탭 캔버스 -->
    <div class="tab-selection-container" id="tabSelectionContainer">
        <svg class="magic-circuit-svg" id="circuitSvg">
            <line id="magicCircuitLine" class="circuit-line" x1="50%" y1="35%" x2="50%" y2="65%"></line>
        </svg>
        <div id="circuitNodesBox"></div>
    </div>

    <!-- 3단계: 기본 성배 상세 뷰 -->
    <section class="tab-detail-view" id="tabDetail_sung">
        <div class="detail-left-box">
            <img src="holygrail.png" alt="Holy Grail Detail" class="detail-img">
            <span class="detail-sub-label">소(小)성배</span>
        </div>
        <div class="detail-right-box">
            <h2 class="description-title">성배란?</h2>
            <div class="description-content">
                <span class="description-quote" id="kotomineTrigger">"성배란, 어떤 소원이라도 이루어주는 원망기다."</span>
                <span class="description-quote-author">- 코토미네 키레이</span>
                <p style="margin-top: 12px;">성배란 <span class="interactive-keyword" data-key="sungbwar">성배전쟁</span>이 일어나기 위한 촉매이다.</p>
            </div>
        </div>
    </section>

    <!-- 동적 탭 보관소 -->
    <div id="dynamicTabDetailViews"></div>

    <div class="bottom-left-controls" id="backBtnWrapper">
        <button class="fate-back-btn" id="backBtn">⇦ 뒤로가기</button>
    </div>

    <div class="bottom-right-controls" id="controlsGroup">
        <div class="sound-panel">
            <div class="volume-control-box">
                <span class="volume-label">SFX</span>
                <input type="range" id="seSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.1">
            </div>
            <div class="volume-control-box">
                <span class="volume-label">BGM</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.1">
            </div>
            <div class="volume-control-box">
                <span class="volume-label">VOICE</span>
                <input type="range" id="voiceSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.3">
            </div>
        </div>
        <footer class="watermark">Made by 사과사과</footer>
    </div>

    <script>
        const CONCEPT_REGISTRY = {
            'sung': { name: '성배', builtIn: true },
            'sungbwar': { name: '성배전쟁', builtIn: false }
        };

        (function checkReloadAndReset() {
            const navEntries = performance.getEntriesByType('navigation');
            const isReload = (navEntries.length > 0 && navEntries[0].type === 'reload') || 
                             (performance.navigation && performance.navigation.type === 1);
            if (isReload) {
                Object.keys(CONCEPT_REGISTRY).forEach(id => sessionStorage.removeItem('fate_concept_' + id));
                sessionStorage.removeItem('fate_concept_order');
                sessionStorage.removeItem('fate_revealed_sungbwar');
            }
        })();

        document.addEventListener('DOMContentLoaded', function() {
            if (!history.state || history.state.stage !== 1) {
                history.replaceState({ stage: 1 }, '', '');
            }

            sessionStorage.setItem('fate_concept_sung', 'true');
            let conceptOrder = JSON.parse(sessionStorage.getItem('fate_concept_order') || '[]');
            if (!conceptOrder.includes('sung')) {
                conceptOrder.push('sung');
                sessionStorage.setItem('fate_concept_order', JSON.stringify(conceptOrder));
            }

            const bgm = document.getElementById('bgm');
            const pstSfx = document.getElementById('pstSfx');
            const wordSfx = document.getElementById('wordSfx');
            const noshinSfx = document.getElementById('noshinSfx');
            const kotomineSfx = document.getElementById('kotomineSfx');

            const volumeSlider = document.getElementById('volumeSlider');
            const seSlider = document.getElementById('seSlider');
            const voiceSlider = document.getElementById('voiceSlider');

            const startBtn = document.getElementById('startBtn');
            const pressStartBtn = document.getElementById('pressStartBtn');
            const backBtn = document.getElementById('backBtn');
            const acquireToastContainer = document.getElementById('acquireToastContainer');

            const grailWrapper = document.getElementById('grailWrapper');
            const subTitle = document.getElementById('subTitle');
            const pressStartWrapper = document.getElementById('pressStartWrapper');
            const introNotice = document.getElementById('introNotice');

            const tabSelectionContainer = document.getElementById('tabSelectionContainer');
            const circuitNodesBox = document.getElementById('circuitNodesBox');
            const magicCircuitLine = document.getElementById('magicCircuitLine');
            const dynamicTabDetailViews = document.getElementById('dynamicTabDetailViews');
            const backBtnWrapper = document.getElementById('backBtnWrapper');

            let currentStage = 1;
            let currentActiveTabId = null;
            let activeToastCount = 0;
            let activeGhostClone = null;

            volumeSlider.addEventListener('input', function() { if (bgm) bgm.volume = parseFloat(this.value); });
            seSlider.addEventListener('input', function() {
                if (pstSfx) pstSfx.volume = parseFloat(this.value);
                if (wordSfx) wordSfx.volume = Math.min(1, parseFloat(this.value) * 4.0);
                if (noshinSfx) noshinSfx.volume = parseFloat(this.value);
            });
            voiceSlider.addEventListener('input', function() { if (kotomineSfx) kotomineSfx.volume = parseFloat(this.value); });

            seSlider.addEventListener('change', function() {
                if (pstSfx) { pstSfx.currentTime = 0; pstSfx.play().catch(()=>{}); }
            });

            if (kotomineSfx) {
                kotomineSfx.addEventListener('timeupdate', function() {
                    if (this.currentTime >= 4.4) { this.pause(); this.currentTime = 0; }
                });
            }

            // 오디오 정책 잠금 해제
            function unlockAudioPolicy() {
                [bgm, pstSfx, wordSfx, noshinSfx, kotomineSfx].forEach(audio => {
                    if (audio) {
                        audio.play().then(() => {
                            audio.pause();
                            audio.currentTime = 0;
                        }).catch(() => {});
                    }
                });
                document.removeEventListener('click', unlockAudioPolicy);
            }
            document.addEventListener('click', unlockAudioPolicy);

            // ★ 어록 터치/클릭 100% 재생 엔진 ★
            document.addEventListener('click', function(e) {
                const quoteTarget = e.target.closest('#kotomineTrigger');
                if (quoteTarget) {
                    e.preventDefault();
                    if (!quoteTarget.classList.contains('glow-fade-out')) {
                        quoteTarget.classList.add('glow-fade-out');
                    }
                    if (kotomineSfx) {
                        kotomineSfx.volume = parseFloat(voiceSlider.value);
                        kotomineSfx.currentTime = 0;
                        kotomineSfx.play().catch(err => console.log("보이스 재생 오류:", err));
                    }
                }
            });

            function spawnAcquireToast(wordText) {
                activeToastCount++;
                const toastEl = document.createElement('div');
                toastEl.className = 'word-toast-item';
                toastEl.innerText = `—${wordText}을(를) 획득했습니다—`;
                acquireToastContainer.appendChild(toastEl);

                setTimeout(() => {
                    if (toastEl && toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
                    activeToastCount = Math.max(0, activeToastCount - 1);
                }, 1800);
            }

            // ★ 신규개념 키워드 획득 엔진 ★
            document.addEventListener('click', function(e) {
                const keyTarget = e.target.closest('.interactive-keyword');
                if (keyTarget) {
                    e.preventDefault();
                    
                    if (activeToastCount > 0) {
                        if (noshinSfx) {
                            noshinSfx.volume = parseFloat(seSlider.value);
                            noshinSfx.currentTime = 0;
                            noshinSfx.play().catch(()=>{});
                        }
                        return;
                    }

                    if (!keyTarget.classList.contains('clicked')) {
                        keyTarget.classList.add('clicked');
                        const id = keyTarget.getAttribute('data-key');
                        sessionStorage.setItem('fate_concept_' + id, 'true');

                        let orderList = JSON.parse(sessionStorage.getItem('fate_concept_order') || '[]');
                        if (!orderList.includes(id)) {
                            orderList.push(id);
                            sessionStorage.setItem('fate_concept_order', JSON.stringify(orderList));
                        }

                        if (wordSfx) {
                            wordSfx.volume = Math.min(1, parseFloat(seSlider.value) * 4.0);
                            wordSfx.currentTime = 0;
                            wordSfx.play().catch(()=>{});
                        }
                        spawnAcquireToast(keyTarget.innerText.trim());
                    }
                }
            });

            // 캔버스 노드 렌더링 엔진 (절대 ID 일치 구조)
            function renderCircuitCanvas(hideAll = false) {
                circuitNodesBox.innerHTML = '';
                
                const hasSungbwar = (sessionStorage.getItem('fate_concept_sungbwar') === 'true');
                const isWarRevealed = (sessionStorage.getItem('fate_revealed_sungbwar') === 'true');

                if (hasSungbwar && isWarRevealed) {
                    magicCircuitLine.style.strokeDashoffset = '0';
                } else {
                    magicCircuitLine.style.strokeDashoffset = '2000';
                }

                // 1. 성배 노드
                const sungBox = document.createElement('div');
                sungBox.className = 'circuit-node-box';
                sungBox.id = 'node_sung';
                sungBox.style.top = (hasSungbwar || isWarRevealed) ? '35%' : '50%';
                sungBox.style.left = '50%';
                sungBox.style.opacity = hideAll ? '0' : '1';
                
                const sungBtn = document.createElement('button');
                sungBtn.className = 'tab-item-btn';
                sungBtn.id = 'btn_sung';
                sungBtn.innerText = '성배';
                sungBtn.onclick = () => openTabDetailView('sung', sungBox, sungBtn);
                sungBox.appendChild(sungBtn);
                circuitNodesBox.appendChild(sungBox);

                // 2. 성배전쟁 노드
                if (hasSungbwar || isWarRevealed) {
                    const warBox = document.createElement('div');
                    warBox.className = 'circuit-node-box';
                    warBox.id = 'node_sungbwar';
                    warBox.style.top = '65%';
                    warBox.style.left = '50%';
                    warBox.style.opacity = (!hideAll && isWarRevealed) ? '1' : '0';

                    const warBtn = document.createElement('button');
                    warBtn.className = 'tab-item-btn';
                    warBtn.id = 'btn_sungbwar';
                    warBtn.style.fontSize = '3.5rem';
                    warBtn.innerText = '성배전쟁';
                    warBtn.onclick = () => openTabDetailView('sungbwar', warBox, warBtn);
                    warBox.appendChild(warBtn);
                    circuitNodesBox.appendChild(warBox);

                    if (!document.getElementById('tabDetail_sungbwar')) {
                        createPlaceholderTabDetailView('sungbwar');
                    }
                }
            }

            function createPlaceholderTabDetailView(id) {
                const viewSection = document.createElement('section');
                viewSection.className = 'tab-detail-view';
                viewSection.id = 'tabDetail_' + id;
                viewSection.innerHTML = `
                    <div class="detail-left-box"></div>
                    <div class="detail-right-box">
                        <h2 class="description-title">${CONCEPT_REGISTRY[id].name}란?</h2>
                        <div class="description-content"></div>
                    </div>
                `;
                dynamicTabDetailViews.appendChild(viewSection);
            }

            // 탭 선택 -> 상세 뷰 이륙 연산
            function openTabDetailView(selectedId, selectedBox, selectedBtn) {
                history.pushState({ stage: 3, id: selectedId }, '', '');

                if (pstSfx) {
                    pstSfx.currentTime = 0;
                    pstSfx.play().catch(()=>{});
                }

                currentActiveTabId = selectedId;
                const rect = selectedBtn.getBoundingClientRect();

                const ghostClone = document.createElement('div');
                ghostClone.className = 'ghost-tab-clone';
                ghostClone.innerText = selectedBtn.innerText;
                ghostClone.style.fontSize = selectedBtn.style.fontSize || '4.5rem';
                ghostClone.style.top = rect.top + 'px';
                ghostClone.style.left = rect.left + 'px';
                document.body.appendChild(ghostClone);
                activeGhostClone = ghostClone;

                tabSelectionContainer.classList.remove('show');
                
                void ghostClone.offsetWidth; // Reflow
                ghostClone.classList.add('move-to-target');

                const targetView = document.getElementById('tabDetail_' + selectedId);
                setTimeout(() => {
                    if (targetView) targetView.classList.add('show');
                    currentStage = 3;
                }, 1000);
            }

            pressStartBtn.addEventListener('click', function() {
                history.pushState({ stage: 2 }, '', '');
                if (pstSfx) {
                    pstSfx.volume = parseFloat(seSlider.value);
                    pstSfx.currentTime = 0;
                    pstSfx.play().catch(()=>{});
                }

                pressStartWrapper.classList.add('flash-exit');
                setTimeout(() => {
                    grailWrapper.classList.add('slow-fade-out');
                    subTitle.classList.add('slow-fade-out');
                    introNotice.classList.add('slow-fade-out');
                }, 250);

                setTimeout(() => {
                    renderCircuitCanvas(false);
                    tabSelectionContainer.classList.add('show');
                    backBtnWrapper.classList.add('show');
                    currentStage = 2;
                }, 1450);
            });

            backBtn.addEventListener('click', function() { history.back(); });

            // ★ 단일 큐 동기화 방식: 무결점 마력 회로 타임라인 연산 ★
            window.addEventListener('popstate', function(event) {
                const targetStage = (event.state && event.state.stage) ? event.state.stage : 1;
                if (targetStage >= currentStage) return;

                if (pstSfx) { pstSfx.currentTime = 0; pstSfx.play().catch(()=>{}); }
                if (kotomineSfx) { kotomineSfx.pause(); kotomineSfx.currentTime = 0; }

                if (currentStage === 3) {
                    currentStage = targetStage;
                    
                    const activeView = document.getElementById('tabDetail_' + currentActiveTabId);
                    if (activeView) activeView.classList.remove('show');

                    if (targetStage === 2) {
                        renderCircuitCanvas(true); // 목표 절대 좌표 세팅용 투명 렌더링
                        tabSelectionContainer.classList.add('show');
                    }

                    const targetBtn = document.getElementById('btn_' + currentActiveTabId);
                    let targetRect = null;
                    if (targetBtn) {
                        targetRect = targetBtn.getBoundingClientRect(); // 100% 안전한 절대 좌표 추출
                    }

                    // 1단계: 100% 일치 좌표로 복귀 비행 (1.0초)
                    if (activeGhostClone && targetRect) {
                        activeGhostClone.classList.remove('move-to-target');
                        activeGhostClone.style.top = targetRect.top + 'px';
                        activeGhostClone.style.left = targetRect.left + 'px';
                        activeGhostClone.style.transform = 'scale(1)';
                        activeGhostClone.style.filter = 'brightness(1)';
                    }

                    // 착륙 비행 1.0초 대기
                    setTimeout(() => {
                        // 깜빡임 0.0% 보장: 클론 소멸과 동시에 원본 등장
                        if (activeGhostClone) {
                            activeGhostClone.remove();
                            activeGhostClone = null;
                        }

                        // 버그 수정 완료 구역: ID 매칭 100% 확정
                        const activeNode = document.getElementById('node_' + currentActiveTabId);
                        if (activeNode) activeNode.style.opacity = '1';

                        const hasSungbwar = sessionStorage.getItem('fate_concept_sungbwar') === 'true';
                        const isWarRevealed = sessionStorage.getItem('fate_revealed_sungbwar') === 'true';

                        // 신규 획득 후 최초 복귀 시 마력 회로 타임라인 체인
                        if (hasSungbwar && !isWarRevealed && targetStage === 2) {
                            sessionStorage.setItem('fate_revealed_sungbwar', 'true');
                            
                            // 인식 딜레이 (0.15초)
                            setTimeout(() => {
                                // 2단계: 마력 회로 전개 (0.8초)
                                magicCircuitLine.style.strokeDashoffset = '0';
                                if (wordSfx) {
                                    wordSfx.volume = Math.min(1, parseFloat(seSlider.value) * 3.5);
                                    wordSfx.currentTime = 0;
                                    wordSfx.play().catch(()=>{});
                                }

                                // 3단계: 신규 탭 소환 페이드인 (회로가 끝단에 닿는 0.8초 직후)
                                setTimeout(() => {
                                    const warNode = document.getElementById('node_sungbwar');
                                    if (warNode) warNode.style.opacity = '1';
                                }, 800);
                                
                            }, 150);
                            
                        } else {
                            // 신규 개념이 없는 경우 모든 탭 즉시 등장
                            document.querySelectorAll('.circuit-node-box').forEach(n => n.style.opacity = '1');
                        }
                        
                        if (targetStage === 1) {
                            tabSelectionContainer.classList.remove('show');
                            backBtnWrapper.classList.remove('show');
                            grailWrapper.classList.remove('slow-fade-out');
                            subTitle.classList.remove('slow-fade-out');
                            introNotice.classList.remove('slow-fade-out');
                            pressStartWrapper.classList.remove('flash-exit');
                            pressStartWrapper.style.opacity = '1';
                            pressStartWrapper.style.pointerEvents = 'auto';
                        }
                        currentActiveTabId = null;

                    }, 1000);

                } else if (currentStage === 2 && targetStage === 1) {
                    currentStage = 1;
                    tabSelectionContainer.classList.remove('show');
                    backBtnWrapper.classList.remove('show');

                    setTimeout(() => {
                        grailWrapper.classList.remove('slow-fade-out');
                        subTitle.classList.remove('slow-fade-out');
                        introNotice.classList.remove('slow-fade-out');
                    }, 300);

                    setTimeout(() => {
                        pressStartWrapper.classList.remove('flash-exit');
                        pressStartWrapper.style.opacity = '0';
                        void pressStartWrapper.offsetWidth;
                        pressStartWrapper.style.opacity = '1';
                        pressStartWrapper.style.pointerEvents = 'auto';
                    }, 800);
                }
            });

            startBtn.addEventListener('click', function() {
                const btnContainer = document.getElementById('btnContainer');
                const bgLayer = document.getElementById('bgLayer');
                const dustEffect = document.getElementById('dustEffect');
                const controlsGroup = document.getElementById('controlsGroup');

                btnContainer.classList.add('hide');

                if (bgm) {
                    bgm.volume = parseFloat(volumeSlider.value);
                    setTimeout(() => { bgm.play().catch(()=>{}); }, 700);
                }

                if (pstSfx) pstSfx.volume = parseFloat(seSlider.value);
                if (wordSfx) wordSfx.volume = Math.min(1, parseFloat(seSlider.value) * 4.0);
                if (noshinSfx) noshinSfx.volume = parseFloat(seSlider.value);
                if (kotomineSfx) kotomineSfx.volume = parseFloat(voiceSlider.value);

                setTimeout(() => bgLayer.classList.add('active'), 300);
                setTimeout(() => dustEffect.classList.add('active'), 500);
                setTimeout(() => grailWrapper.classList.add('animate'), 1400);

                setTimeout(() => {
                    subTitle.classList.add('animate');
                    introNotice.classList.add('animate');
                    controlsGroup.classList.add('animate');
                }, 2200);

                setTimeout(() => pressStartWrapper.classList.add('animate'), 3000);
            });
        });
    </script>
</body>
</html>
