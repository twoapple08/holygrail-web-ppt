<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성배전쟁 - Fate/stay night 테마</title>
    <!-- 송명체(Song Myung) 웹 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Song Myung', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-image: url('first-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
        }

        /* 배경 이미지 위에 겹쳐질 은은한 마력 오라 레이어 */
        .background-aura {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(80, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.6) 80%);
            z-index: 1;
            animation: pulse-aura 4s infinite alternate ease-in-out;
            pointer-events: none;
        }

        /* 화면 아래쪽 전체에 깔리는 붉은 먼지/안개 이펙트 레이어 */
        .red-dust-effect {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(to top, rgba(140, 10, 10, 0.45) 0%, rgba(80, 0, 0, 0.2) 50%, transparent 100%);
            z-index: 2;
            pointer-events: none;
            animation: dust-fade 6s infinite alternate ease-in-out;
        }

        /* 컨텐츠 컨테이너 */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
            background: transparent;
        }

        /* 성배 이미지 래퍼 (정중앙 섬광 후 등장) */
        .holy-grail-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: transparent !important;
            margin-bottom: 20px;
            opacity: 0;
            transform: scale(0.7);
            animation: grail-flash-appear 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        /* 성배 본체 (위아래로 아주 살짝씩만 부유하는 루프 애니메이션) */
        .holy-grail-img {
            width: 180px;
            max-width: 100%;
            height: auto;
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            animation: grail-gentle-float 3s infinite ease-in-out;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
        }

        /* 본제목 (아래쪽에서 중앙에 있다가 좌우로 퍼지며 등장 - 1.0초 지연) */
        .main-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 7px;
            margin-bottom: 12px;
            color: #f5f0e6;
            text-shadow: 
                3px 3px 0px #700000, 
                -1px -1px 0px #700000, 
                1px -1px 0px #700000, 
                -1px 1px 0px #700000,
                0 0 35px rgba(255, 50, 50, 0.7);
            text-transform: uppercase;
            opacity: 0;
            transform: scaleX(0.2) translateY(15px);
            animation: title-spread-appear 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
        }

        /* 소제목 (페이드 인 등장 - 1.8초 지연) */
        .sub-title {
            font-size: 1.15rem;
            font-weight: 400;
            color: #b5b5c2;
            letter-spacing: 1px;
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
            padding: 0 15px;
            opacity: 0;
            animation: fade-in 1.2s ease-out 1.8s forwards;
        }

        /* 화면 맨 오른쪽 아래 워터마크 (2.2초 지연) */
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 25px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1.5px;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            animation: fade-in 1.5s ease-out 2.2s forwards;
        }

        /* --- 동적 애니메이션 정의 --- */

        /* 성배가 섬광과 함께 번쩍이며 나타나는 연출 */
        @keyframes grail-flash-appear {
            0% {
                opacity: 0;
                transform: scale(0.5);
                filter: drop-shadow(0 0 50px rgba(255, 255, 255, 1));
            }
            50% {
                opacity: 0.8;
                transform: scale(1.08);
                filter: drop-shadow(0 0 35px rgba(255, 230, 100, 0.9));
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
            }
        }

        /* 성배 본체가 위아래로 아주 살짝만 움직이는 루프 효과 */
        @keyframes grail-gentle-float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        /* 본제목이 중심에서 좌우로 퍼지며 나타나는 연출 */
        @keyframes title-spread-appear {
            0% {
                opacity: 0;
                transform: scaleX(0.2) translateY(15px);
                letter-spacing: 0px;
            }
            100% {
                opacity: 1;
                transform: scaleX(1) translateY(0);
                letter-spacing: 7px;
            }
        }

        @keyframes pulse-aura {
            0% {
                opacity: 0.4;
                transform: scale(0.98);
            }
            100% {
                opacity: 0.8;
                transform: scale(1.02);
            }
        }

        @keyframes dust-fade {
            0% {
                opacity: 0.7;
            }
            100% {
                opacity: 1;
            }
        }

        /* 단순 페이드인 */
        @keyframes fade-in {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- 배경 마력 이펙트 레이어 -->
    <div class="background-aura"></div>

    <!-- 화면 아래쪽 붉은 먼지/안개 이펙트 레이어 -->
    <div class="red-dust-effect"></div>

    <!-- 컨텐츠 레이어 -->
    <main class="content-container">
        <!-- 1. 성배 이미지 -->
        <div class="holy-grail-wrapper">
            <img src="holygrail.png" alt="Holy Grail" class="holy-grail-img">
        </div>

        <!-- 2. 본제목 -->
        <h1 class="main-title">성배전쟁</h1>

        <!-- 3. 소제목 -->
        <p class="sub-title">온갖 시대, 온갖 나라의 영웅이 현대에 되살아나 힘을 겨루는 살육전</p>
    </main>

    <!-- 화면 우측 하단 워터마크 -->
    <footer class="watermark">Made by 사과사과</footer>

</body>
</html>
